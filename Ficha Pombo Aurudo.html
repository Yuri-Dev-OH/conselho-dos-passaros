<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ficha Pombo Aurudo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
  /* Layout: mesmo modelo das outras fichas. Foto no topo, radar com duas formas (com e sem a manopla), painel de dados em linhas separadas por filetes. Troque só o objeto CHAR no fim do arquivo. */
  :root {
    --canvas: #0b0906;
    --surface: #15100b;
    --raised: #1e1710;
    --line: rgba(255, 205, 150, 0.13);
    --line-strong: rgba(255, 205, 150, 0.24);
    --accent: #ff9a3c;
    --warn: #ff6f8e;
    --ink: #f5ede3;
    --muted: #a89884;
    --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --font-body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    justify-content: center;
  }

  .card {
    width: min(460px, 100%);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 16px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 24px 60px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }

  /* foto + frase */
  .photo { position: relative; aspect-ratio: 744 / 500; background: #120f0a; border-bottom: 1px solid var(--line); overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%; display: block; }
  .quote {
    position: absolute; left: 16px; bottom: 16px; right: 16px;
    background: rgba(11, 9, 6, 0.92);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 16px; font-weight: 500; font-style: italic; line-height: 1.35;
    text-wrap: balance;
  }
  .quote::before {
    content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; background: var(--accent); border-radius: 2px;
  }
  .quote span { padding-left: 4px; display: block; }

  /* cabeçalho */
  .panel { padding: 20px 20px 4px; display: grid; gap: 18px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(34px, 9.4vw, 44px); line-height: 1.05; letter-spacing: 0.01em; text-transform: uppercase;
    text-wrap: balance;
  }
  .sub { margin: 2px 0 0; font-size: 14px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }

  .grade { display: flex; align-items: flex-end; gap: 12px; }
  .grade .txt { display: grid; text-align: right; line-height: 1.25; }
  .grade .lbl { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .grade .val { font-size: 16px; font-weight: 600; }
  .grade .note { font-size: 12px; color: var(--muted); }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 30px; }
  .bars i { display: block; width: 6px; border-radius: 1.5px; background: rgba(255, 205, 150, 0.16); }
  .bars i.on { background: var(--accent); }

  /* radar */
  .section-label { margin: 0 0 4px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .radar-box { border: 1px solid var(--line); border-radius: 12px; background: var(--raised); padding: 12px 8px 4px; }
  .radar-box .section-label { padding-left: 8px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 2px 8px 0; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 0; display: inline-block; border-top: 2px solid var(--accent); }
  .legend i.base { border-top: 2px dashed var(--muted); }
  #radar { width: 100%; height: auto; display: block; }
  #radar text { font-family: var(--font-body); }
  #radar .name { font-size: 12px; font-weight: 500; fill: var(--muted); }
  #radar .val { font-size: 14px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }

  /* linhas de dados */
  .groups { display: grid; gap: 20px; }
  .group .section-label { margin: 0 0 8px; font-weight: 500; }
  .row .k:empty, .row .d:empty { display: none; }
  .rows { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .ico {
    width: 40px; height: 40px; display: grid; place-items: center;
    border: 1px solid var(--line-strong); border-radius: 10px; background: var(--raised); color: var(--accent);
  }
  .ico svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .row .k { display: block; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
  .row .v { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; }
  .row .d { display: block; font-size: 14px; color: var(--muted); line-height: 1.4; margin-top: 1px; }
  .row.weak .ico { color: var(--warn); }

  .foot { padding: 14px 20px 18px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }
</style>

          { icon: "force",   value: "Joia do Poder", desc: "Laser contínuo ou disparo único, mais forte que o nativo. Reforça passivamente a resistência e os golpes. Gastar energia reforça também a força e o poder de fogo." },
          { icon: "shieldp", label: "Joia do Poder", value: "Escudo", desc: "Cria um escudo em volta dele ou de outras pessoas, mesmo de longe." },
          { icon: "space",   value: "Joia do Espaço", desc: "Voo mais rápido, estável e flexível. Teletransporta para qualquer lugar visível ou já visitado. Quanto mais longe, mais energia." },
          { icon: "mind",    value: "Joia da Mente", desc: "Lê a mente dos outros e envia mensagens telepáticas. Cria um elo mental para ver, ouvir e sentir o que a pessoa sente, mas o elo só funciona com a aprovação dela." },
          { icon: "soul",    value: "Joia da Alma", desc: "Transfere energia para curar a si ou outros de longe, ou converte vida em energia. Quem doa precisa concordar. Sem acordo, ele rouba a força no combate." },
          { icon: "reality", value: "Joia da Realidade", desc: "Cria coisas pela imaginação ou muda o estado de algo, como um anel de lanterna. Gasta mais energia que todas, menos o tempo." },
          { icon: "time",    value: "Joia do Tempo", desc: "Desacelera, para e até volta o tempo. Gasta energia demais." }
        ]
      },
      {
        title: "Energia em combate",
        rows: [
          { icon: "eatshield", label: "Defesa", value: "Escudo Faminto", desc: "Quando o escudo segura um golpe, parte do dano vira energia para ele. Golpe forte demais quebra o escudo e não rende nada." },
          { icon: "siphon",    label: "Joia da Alma", value: "Soco que Rouba", desc: "Cada golpe que acerta puxa um pouco da energia do alvo. Exige contato, o que o deixa perto do perigo." },
          { icon: "meter",     label: "Acúmulo", value: "Medidor de Aura", desc: "Golpes dados, recebidos e bloqueados enchem a aura. Cheia, libera o Ligar Aura." },
          { icon: "give",      label: "Equipe", value: "Doação dos Aliados", desc: "Aliados podem doar energia pela Joia da Alma. Isso faz deles uma bateria viva." },
          { icon: "crumbs",    label: "Recarga", value: "Migalhas", desc: "Fora da luta, recarrega comendo pão e migalhas. É por isso que ele não para de comer." }
        ]
      },
      {
        title: "Pontos fracos",
        rows: [
          { icon: "nogem",  label: "Limitação", value: "Dependência Total", desc: "Sem a manopla, perde força, velocidade e energia. Só sobram o laser e a Praça do Atalho.", weak: true },
          { icon: "wing",   label: "Limitação", value: "Voo Emprestado", desc: "Só voa pela Joia do Espaço. Parou de treinar e as asas não aguentam mais sozinhas.", weak: true },
          { icon: "weight", label: "Limitação", value: "Corpo Obeso", desc: "Lento, sem fôlego e com pouca energia própria. Cansa rápido depois de qualquer esforço.", weak: true },
          { icon: "queasy",    label: "Limitação", value: "Energia Roubada Dissipa", desc: "A energia que ele rouba ou recebe se perde rápido se não for usada. Guardar demais o deixa enjoado.", weak: true },
          { icon: "drain",  label: "Custo", value: "Joias Cobram", desc: "Cada joia gasta a energia dele. As mais fortes o deixam parado em poucos usos.", weak: true },
          { icon: "steal",  label: "Fraqueza", value: "Manopla Tomável", desc: "Quem tirar a manopla do braço dele vence a luta.", weak: true }
        ]
      }
    ]
  };

  /* ===== ícones próprios (grade 24, traço 1.6) ===== */
  const GEM = '<path d="M7 4h10l3.5 5.5L12 21 3.5 9.5z"/><path d="M3.5 9.5h17M9.2 4L7.6 9.5 12 21M14.8 4l1.6 5.5L12 21"/>';
  const ICONS = {
    laser:
      '<circle cx="12" cy="12" r="3"/><path d="M2.5 12h6.5M15 12h6.5"/>' +
      '<path d="M4.5 8.4h3.4M16.1 8.4h3.4M4.5 15.6h3.4M16.1 15.6h3.4"/>',
    gem: GEM,
    aura:
      '<circle cx="12" cy="12" r="3"/>' +
      '<path d="M7 7.2a7 7 0 0 0 0 9.6M17 7.2a7 7 0 0 1 0 9.6"/>' +
      '<path d="M4.2 4.6a12 12 0 0 0 0 14.8M19.8 4.6a12 12 0 0 1 0 14.8"/>',
    force:
      '<path d="M12 2.8l1.6 5 4.8-2.2-2.2 4.8 5 1.6-5 1.6 2.2 4.8-4.8-2.2-1.6 5-1.6-5-4.8 2.2 2.2-4.8-5-1.6 5-1.6-2.2-4.8 4.8 2.2z"/>',
    space:
      '<ellipse cx="9.5" cy="12" rx="3.6" ry="8"/><path d="M13.6 12h8M18.6 8.8l3.2 3.2-3.2 3.2"/><path d="M2.5 12h3.4"/>',
    time:
      '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.4 2"/>',
    mind:
      '<path d="M12 12.2a1.4 1.4 0 1 1 1.6 1.4 3.2 3.2 0 1 1-3.5-4.2 5.2 5.2 0 1 1 5.6 6.9"/>',
    reality:
      '<path d="M12 3l8 4.4v9.2L12 21l-8-4.4V7.4z"/><path d="M4 7.4l8 4.4 8-4.4M12 11.8V21"/>',
    soul:
      '<path d="M12 3c1 3.4 5.2 5.8 5.2 10.4a5.2 5.2 0 0 1-10.4 0c0-2 .8-3.2 1.8-4.3.2 1.6.9 2.5 1.7 3 .2-3.1.7-6.1 1.7-9.1z"/>',
    nogem: GEM + '<path d="M3.2 3.2l17.6 17.6"/>',
    weight:
      '<path d="M9 7.5a3 3 0 1 1 6 0"/><path d="M7.2 9.2h9.6l2 11H5.2z"/>',
    drain:
      '<rect x="3" y="8" width="16" height="9" rx="2"/><path d="M21 11v3M6.5 11.5v2"/>',
    steal:
      '<circle cx="7.5" cy="12" r="3.8"/><path d="M12.5 12h8.5M17.4 8.4l3.6 3.6-3.6 3.6"/>',
    shieldp:
      '<path d="M12 3l7 2.8v5.4c0 4.6-3 8.1-7 9.8-4-1.7-7-5.2-7-9.8V5.8z"/><path d="M12 8.6v5M9.5 11.1h5"/>',
    eatshield:
      '<path d="M12 3l7 2.8v5.4c0 4.6-3 8.1-7 9.8-4-1.7-7-5.2-7-9.8V5.8z"/><path d="M12 7.8v6.2M9.4 11.8l2.6 2.6 2.6-2.6"/>',
    siphon:
      '<circle cx="12" cy="12" r="1.8"/><path d="M4 4l5 5M9 5.6V9H5.6M20 4l-5 5M15 5.6V9h3.4M4 20l5-5M9 18.4V15H5.6M20 20l-5-5M15 18.4V15h3.4"/>',
    meter:
      '<path d="M4.5 17a8 8 0 1 1 15 0"/><path d="M12 15.5l3.4-5"/><path d="M4 20.5h16"/>',
    give:
      '<path d="M12 20s-7.5-4.6-7.5-10a4.3 4.3 0 0 1 7.5-2.8A4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>',
    crumbs:
      '<path d="M6 9a4 4 0 0 1 3-6h6a4 4 0 0 1 3 6v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M10 12.5v0M14 15.5v0M11.6 17.6v0"/>',
    queasy:
      '<path d="M2.8 12c2-4.4 4.2-4.4 6.2 0s4.2 4.4 6.2 0 3.2-3.2 6-.4"/><path d="M3 17.5h18"/>',
    wing:
      '<path d="M3.5 17c3-.5 6.5-3.5 7.6-8.4C13.6 8.8 17 11 19.5 16c-2.7-1.4-5.2-1.7-7.4-.7-2 .9-4.8 1.8-8.6 1.7z"/><path d="M3.2 3.2l17.6 17.6"/>',
    sixgems:
      '<circle cx="20" cy="12" r="1.5"/><circle cx="16" cy="18.9" r="1.5"/><circle cx="8" cy="18.9" r="1.5"/><circle cx="4" cy="12" r="1.5"/><circle cx="8" cy="5.1" r="1.5"/><circle cx="16" cy="5.1" r="1.5"/>' +
      '<path d="M12 8.6l2.6 3.4-2.6 3.4-2.6-3.4z"/>',
    moon:
      '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.7 6.7 0 0 0 10.5 10.5z"/>',
    flock:
      '<path d="M3 9.5c1.3-2 3-2 4.3 0 1.3-2 3-2 4.3 0"/><path d="M12.5 6c1.1-1.7 2.5-1.7 3.6 0 1.1-1.7 2.5-1.7 3.6 0"/><path d="M8 16.5c1.4-2.2 3.2-2.2 4.6 0 1.4-2.2 3.2-2.2 4.6 0"/><path d="M3.5 19.5h17"/>',
    plate:
      '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.3"/>',
    alert:
      '<path d="M12 4l9 16H3z"/><path d="M12 10v4.2M12 17.2v.01"/>',
    uturn:
      '<path d="M5 19V9a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v10"/><path d="M16.5 16.5L19 19l2.5-2.5"/>',
    sofa:
      '<path d="M5.5 11V8a3 3 0 0 1 3-3h7a3 3 0 0 1 3 3v3"/><path d="M3 12.5a2 2 0 0 1 4 0V15h10v-2.5a2 2 0 0 1 4 0V18H3z"/><path d="M6 18v2M18 18v2"/>',
    pause:
      '<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>',
    spark: '<path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/>'
  };

  /* ===== render ===== */
  const $ = (id) => document.getElementById(id);
  document.documentElement.style.setProperty("--accent", CHAR.accent);
  $("name").textContent = CHAR.name;
  $("subtitle").textContent = CHAR.subtitle;
  $("quote").textContent = "“" + CHAR.quote + "”";
  $("footL").textContent = CHAR.role;
  $("footR").textContent = CHAR.series;
  $("gradeNote").textContent = CHAR.gradeNote || "";

  // classificação
  const bars = $("bars");
  $("gradeName").textContent = CHAR.grades[CHAR.grade - 1];
  bars.setAttribute("aria-label", "Classificação: " + CHAR.grades[CHAR.grade - 1]);
  for (let i = 0; i < 5; i++) {
    const b = document.createElement("i");
    b.style.height = (10 + i * 5) + "px";
    if (i < CHAR.grade) b.className = "on";
    bars.appendChild(b);
  }

  // legenda do radar (só quando há valores sem a manopla)
  if (CHAR.statsBase) {
    $("legend").innerHTML = '<span><i></i>' + CHAR.legend[0] + '</span><span><i class="base"></i>' + CHAR.legend[1] + '</span>';
  } else {
    $("legend").hidden = true;
  }

  // radar: N vértices = N atributos
  (function () {
    const svg = $("radar"), NS = "http://www.w3.org/2000/svg";
    const n = CHAR.stats.length, max = 5, cx = 170, cy = 124, R = 80;
    const ang = (i) => (-90 + (360 / n) * i) * Math.PI / 180;
    const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
    const el = (tag, a, text) => {
      const e = document.createElementNS(NS, tag);
      for (const k in a) e.setAttribute(k, a[k]);
      if (text !== undefined) e.textContent = text;
      svg.appendChild(e); return e;
    };
    const poly = (vals) => vals.map((v, i) => pt(i, R * v / max).map(c => c.toFixed(1)).join(",")).join(" ");
    for (let l = 1; l <= max; l++) {
      const pts = CHAR.stats.map((_, i) => pt(i, R * l / max).map(v => v.toFixed(1)).join(",")).join(" ");
      el("polygon", { points: pts, fill: "none", stroke: "rgba(255,205,150,0.16)", "stroke-width": l === max ? 1.2 : 1 });
    }
    CHAR.stats.forEach((_, i) => {
      const [x, y] = pt(i, R);
      el("line", { x1: cx, y1: cy, x2: x.toFixed(1), y2: y.toFixed(1), stroke: "rgba(255,205,150,0.12)", "stroke-width": 1 });
    });
    const vals = CHAR.stats.map(([, v]) => v);
    el("polygon", { points: poly(vals), fill: CHAR.accent, "fill-opacity": 0.2, stroke: CHAR.accent, "stroke-width": 1.8, "stroke-linejoin": "round" });
    if (CHAR.statsBase) {
      el("polygon", { points: poly(CHAR.statsBase), fill: "rgba(168,152,132,0.14)", stroke: "#a89884", "stroke-width": 1.6, "stroke-dasharray": "4 3", "stroke-linejoin": "round" });
    }
    vals.forEach((v, i) => {
      const [x, y] = pt(i, R * v / max);
      el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: 3, fill: CHAR.accent, stroke: "#1e1710", "stroke-width": 1.5 });
    });
    CHAR.stats.forEach(([label, v], i) => {
      const [x, y] = pt(i, R + 18), c = Math.cos(ang(i)), s = Math.sin(ang(i));
      const anchor = c > 0.25 ? "start" : c < -0.25 ? "end" : "middle";
      const dy = s < -0.5 ? -10 : s > 0.5 ? 4 : -4;
      el("text", { x: x.toFixed(1), y: (y + dy).toFixed(1), "text-anchor": anchor, class: "name" }, label);
      el("text", { x: x.toFixed(1), y: (y + dy + 15).toFixed(1), "text-anchor": anchor, class: "val" }, String(v));
    });
    svg.setAttribute("aria-label", "Atributos com a manopla: " + CHAR.stats.map(([l, v]) => l + " " + v).join(", ") +
      (CHAR.statsBase ? ". Sem a manopla: " + CHAR.stats.map(([l], i) => l + " " + CHAR.statsBase[i]).join(", ") : ""));
  })();

  // grupos de linhas
  const groups = $("groups");
  CHAR.groups.forEach((g) => {
    const sec = document.createElement("section");
    sec.className = "group";
    const h = document.createElement("h2");
    h.className = "section-label";
    h.textContent = g.title;
    const ul = document.createElement("ul");
    ul.className = "rows";
    g.rows.forEach((r) => {
      const li = document.createElement("li");
      li.className = "row" + (r.weak ? " weak" : "");
      li.innerHTML = '<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[r.icon] || ICONS.spark) + '</svg></span>' +
        '<span><span class="k"></span><span class="v"></span><span class="d"></span></span>';
      li.querySelector(".k").textContent = r.label || "";
      li.querySelector(".v").textContent = r.value;
      li.querySelector(".d").textContent = r.desc || "";
      ul.appendChild(li);
    });
    sec.append(h, ul);
    groups.appendChild(sec);
  });
</script>

</body></html>
