<title>Ficha Passarinho Sorridente</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
  /* Layout: ficha vertical de dossiê. Foto grande no topo, legenda com a frase, painel de dados em linhas separadas por filetes. Troque só o objeto CHAR no fim do arquivo para cada personagem. */
  :root {
    --canvas: #080b12;
    --surface: #0e1420;
    --raised: #141c2c;
    --line: rgba(160, 190, 255, 0.13);
    --line-strong: rgba(160, 190, 255, 0.24);
    --accent: #4cc2ff;
    --warn: #f0907f;
    --ink: #e9eef8;
    --muted: #8c9ab2;
    --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --font-body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    justify-content: center;
  }

  .card {
    width: min(460px, 100%);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 16px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 24px 60px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }

  /* foto + frase */
  .photo { position: relative; aspect-ratio: 744 / 500; background: #06142e; border-bottom: 1px solid var(--line); }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; display: block; }
  .quote {
    position: absolute; left: 16px; bottom: 16px; right: 16px;
    background: rgba(8, 11, 18, 0.92);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 16px; font-weight: 500; font-style: italic; line-height: 1.35;
    text-wrap: balance;
  }
  .quote::before {
    content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; background: var(--accent); border-radius: 2px;
  }
  .quote span { padding-left: 4px; display: block; }

  /* cabeçalho */
  .panel { padding: 20px 20px 4px; display: grid; gap: 18px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(34px, 9.4vw, 44px); line-height: 1.05; letter-spacing: 0.01em; text-transform: uppercase;
    text-wrap: balance;
  }
  .sub { margin: 2px 0 0; font-size: 14px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }

  .grade { display: flex; align-items: flex-end; gap: 12px; }
  .grade .txt { display: grid; text-align: right; line-height: 1.2; }
  .grade .lbl { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .grade .val { font-size: 16px; font-weight: 600; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 30px; }
  .bars i { display: block; width: 6px; border-radius: 1.5px; background: rgba(160, 190, 255, 0.16); }
  .bars i.on { background: var(--accent); }

  /* radar */
  .section-label { margin: 0 0 4px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .radar-box { border: 1px solid var(--line); border-radius: 12px; background: var(--raised); padding: 12px 8px 4px; }
  .radar-box .section-label { padding-left: 8px; }
  #radar { width: 100%; height: auto; display: block; }
  #radar text { font-family: var(--font-body); }
  #radar .name { font-size: 12px; font-weight: 500; fill: var(--muted); }
  #radar .val { font-size: 14px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }

  /* linhas de dados */
  .groups { display: grid; gap: 20px; }
  .group .section-label { margin: 0 0 8px; font-weight: 500; }
  .row .k:empty, .row .d:empty { display: none; }
  .rows { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .ico {
    width: 40px; height: 40px; display: grid; place-items: center;
    border: 1px solid var(--line-strong); border-radius: 10px; background: var(--raised); color: var(--accent);
  }
  .ico svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .row .k { display: block; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
  .row .v { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; }
  .row .d { display: block; font-size: 14px; color: var(--muted); line-height: 1.4; margin-top: 1px; }
  .row.weak .ico { color: var(--warn); }

  .foot { padding: 14px 20px 18px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }
</style>

    const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
    const el = (tag, a, text) => {
      const e = document.createElementNS(NS, tag);
      for (const k in a) e.setAttribute(k, a[k]);
      if (text !== undefined) e.textContent = text;
      svg.appendChild(e); return e;
    };
    for (let l = 1; l <= max; l++) {
      const pts = CHAR.stats.map((_, i) => pt(i, R * l / max).map(v => v.toFixed(1)).join(",")).join(" ");
      el("polygon", { points: pts, fill: "none", stroke: "rgba(160,190,255,0.16)", "stroke-width": l === max ? 1.2 : 1 });
    }
    CHAR.stats.forEach((_, i) => {
      const [x, y] = pt(i, R);
      el("line", { x1: cx, y1: cy, x2: x.toFixed(1), y2: y.toFixed(1), stroke: "rgba(160,190,255,0.12)", "stroke-width": 1 });
    });
    const shape = CHAR.stats.map(([, v], i) => pt(i, R * v / max).map(c => c.toFixed(1)).join(",")).join(" ");
    el("polygon", { points: shape, fill: CHAR.accent, "fill-opacity": 0.2, stroke: CHAR.accent, "stroke-width": 1.8, "stroke-linejoin": "round" });
    CHAR.stats.forEach(([, v], i) => {
      const [x, y] = pt(i, R * v / max);
      el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: 3, fill: CHAR.accent, stroke: "#141c2c", "stroke-width": 1.5 });
    });
    CHAR.stats.forEach(([label, v], i) => {
      const [x, y] = pt(i, R + 18), c = Math.cos(ang(i)), s = Math.sin(ang(i));
      const anchor = c > 0.25 ? "start" : c < -0.25 ? "end" : "middle";
      const dy = s < -0.5 ? -10 : s > 0.5 ? 4 : -4;
      el("text", { x: x.toFixed(1), y: (y + dy).toFixed(1), "text-anchor": anchor, class: "name" }, label);
      el("text", { x: x.toFixed(1), y: (y + dy + 15).toFixed(1), "text-anchor": anchor, class: "val" }, String(v));
    });
    svg.setAttribute("aria-label", "Atributos: " + CHAR.stats.map(([l, v]) => l + " " + v).join(", "));
  })();

  // grupos de linhas
  const groups = $("groups");
  CHAR.groups.forEach((g) => {
    const sec = document.createElement("section");
    sec.className = "group";
    const h = document.createElement("h2");
    h.className = "section-label";
    h.textContent = g.title;
    const ul = document.createElement("ul");
    ul.className = "rows";
    g.rows.forEach((r) => {
      const li = document.createElement("li");
      li.className = "row" + (r.weak ? " weak" : "");
      li.innerHTML = '<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[r.icon] || ICONS.spark) + '</svg></span>' +
        '<span><span class="k"></span><span class="v"></span><span class="d"></span></span>';
      li.querySelector(".k").textContent = r.label || "";
      li.querySelector(".v").textContent = r.value;
      li.querySelector(".d").textContent = r.desc || "";
      ul.appendChild(li);
    });
    sec.append(h, ul);
    groups.appendChild(sec);
  });
</script>

</body></html>
