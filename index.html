<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conselho dos Pássaros</title>
<meta name="theme-color" content="#0b0b0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
  /* ===== Hub: cromo neutro. A ficha recebe a paleta própria de cada personagem. ===== */
  :root {
    --bg: #0b0b0d;
    --panel: #111114;
    --hair: rgba(255, 255, 255, 0.07);
    --hair-2: rgba(255, 255, 255, 0.12);
    --ink: #ececf1;
    --muted: #8c8c97;
    --hover: rgba(255, 255, 255, 0.045);
    --sel: rgba(255, 255, 255, 0.075);
    --danger: #ff6b6b;
    --stage: #0b0b0d;
    --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --font-body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--stage); color: var(--ink);
    font-family: var(--font-body); font-size: 15px; line-height: 1.45;
    transition: background-color 0.35s ease;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: 0.35; cursor: default; }
  :focus-visible { outline: 2px solid rgba(255, 255, 255, 0.55); outline-offset: 2px; }

  svg.ui { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ic { display: inline-grid; place-items: center; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--hair-2); background: transparent;
    font-size: 15px; font-weight: 500; white-space: nowrap;
    transition: background-color 0.15s, border-color 0.15s;
  }
  .btn:hover:not(:disabled) { background: var(--hover); border-color: rgba(255, 255, 255, 0.2); }
  .btn.primary { background: var(--ink); color: #0b0b0d; border-color: transparent; font-weight: 600; }
  .btn.primary:hover { background: #fff; }
  .btn.ghost { border-color: transparent; }
  .btn.danger { color: var(--danger); }
  .btn.sm { height: 32px; padding: 0 10px; font-size: 14px; }
  .icon-btn {
    width: 38px; height: 38px; flex: none; display: grid; place-items: center;
    border: 0; border-radius: 10px; background: transparent;
  }
  .icon-btn:hover:not(:disabled) { background: var(--hover); }
  .icon-btn.sm { width: 32px; height: 32px; }
  .icon-btn.sm svg.ui { width: 18px; height: 18px; }

  .brand b { display: block; font-family: var(--font-display); font-size: 21px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.05; }
  .brand small { display: block; color: var(--muted); font-size: 13px; }

  /* ===== Layout celular (base) ===== */
  .side {
    position: fixed; inset: 0 auto 0 0; z-index: 40;
    width: min(340px, 88vw); background: var(--panel); border-right: 1px solid var(--hair);
    display: flex; flex-direction: column;
    transform: translateX(-100%); transition: transform 0.25s ease;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .app.drawer-open .side { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 39; background: rgba(0, 0, 0, 0.55); opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .app.drawer-open .scrim { opacity: 1; pointer-events: auto; }

  .side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 20px 14px 14px 20px; }
  .search { position: relative; margin: 0 14px 10px; display: block; }
  .search svg.ui { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; }
  .search input {
    width: 100%; height: 40px; padding: 0 12px 0 36px; border-radius: 10px;
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--hair);
    color: var(--ink); font: inherit; font-size: 16px;
  }
  .search input:focus { outline: none; border-color: rgba(255, 255, 255, 0.28); }
  .list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 10px 12px; display: grid; align-content: start; gap: 2px; }
  .item {
    position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center;
    padding: 8px 10px; border-radius: 12px; color: inherit; text-decoration: none;
    transition: background-color 0.15s;
  }
  .item:hover { background: var(--hover); }
  .item.on { background: var(--sel); }
  .item.on::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--acc); }
  .thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; display: block; background: var(--tbg, #1a1a1f); border: 1px solid var(--hair); }
  .thumb.blank { display: grid; place-items: center; color: var(--muted); }
  .item b { display: block; font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item small { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-empty { padding: 24px 12px; color: var(--muted); text-align: center; font-size: 14px; }
  .side-foot { display: flex; gap: 8px; padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--hair); }
  .side-foot .btn.primary { flex: 1; }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 4px;
    padding: env(safe-area-inset-top, 0px) 8px 0 8px; height: calc(56px + env(safe-area-inset-top, 0px));
    background: color-mix(in srgb, var(--stage) 84%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--hair);
    transition: background-color 0.35s ease;
  }
  .topbar .brand { flex: 1; min-width: 0; padding-left: 4px; }
  .topbar .brand b { font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .strip { display: flex; gap: 10px; overflow-x: auto; padding: 14px 16px 4px; scrollbar-width: none; scroll-padding-inline: 16px; }
  .strip::-webkit-scrollbar { display: none; }
  .chip { flex: none; width: 62px; display: grid; justify-items: center; gap: 6px; text-decoration: none; color: var(--muted); font-size: 12px; line-height: 1.2; }
  .chip .thumb { width: 54px; height: 54px; border-radius: 16px; transition: box-shadow 0.2s; }
  .chip.on { color: var(--ink); }
  .chip.on .thumb { box-shadow: 0 0 0 2px var(--stage), 0 0 0 4px var(--acc); }
  .chip span { max-width: 62px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .stage { padding: 16px 16px calc(40px + env(safe-area-inset-bottom, 0px)); transition: background-color 0.35s ease; }
  .toolbar { display: none; }

  .empty { max-width: 360px; margin: 12vh auto 0; text-align: center; color: var(--muted); display: grid; gap: 14px; justify-items: center; }
  .empty h2 { margin: 0; color: var(--ink); font-family: var(--font-display); text-transform: uppercase; font-size: 30px; }
  .empty p { margin: 0; }

  .preview-pill {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 45;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  .app:not(.previewing) .preview-pill { display: none; }
  .app.is-editing .topbar .icon-btn { visibility: hidden; }
  .app.locked [data-need="edit"], .app:not(.locked) [data-need="lock"] { display: none !important; }
  .side-foot .btn[data-act="login"] { flex: 1; }
  dialog.confirm .in { margin-top: 4px; }
  .login-err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 8px 0 12px !important; }

  /* ===== Layout PC ===== */
  @media (min-width: 1024px) {
    body { overflow: hidden; }
    .app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100vh; }
    .app { grid-template-rows: 100vh; }
    .side { position: relative; inset: auto; width: auto; height: 100vh; min-height: 0; transform: none; transition: none; z-index: auto; padding-top: 0; }
    .topbar, .strip, .scrim, .side-close, .preview-pill { display: none !important; }
    .stage { height: 100vh; overflow-y: auto; padding: 0 36px 56px; }
    .toolbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      height: 64px; margin: 0 -36px 12px; padding: 0 36px;
      background: color-mix(in srgb, var(--stage) 82%, transparent);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      transition: background-color 0.35s ease;
    }
    .toolbar .nav, .toolbar .tools { display: flex; align-items: center; gap: 6px; }
    .toolbar .pos { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; margin-left: 6px; }
    .toolbar .editing-label { color: var(--muted); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
    .app.is-editing { grid-template-columns: minmax(0, 1fr) 500px; }
    .app.is-editing .side { display: none; }
  }

  /* ===== Ficha (porta fiel do modelo original, escopada em .sheet) ===== */
  .sheet { container-type: inline-size; color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
  .sheet.enter { animation: enter 0.28s ease both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .sheet.enter { animation: none; } * { transition-duration: 0s !important; } }

  .card {
    width: min(460px, 100%); margin: 0 auto;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 16px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 24px 60px rgba(0, 0, 0, 0.5);
    overflow: clip;
  }
  .photo { position: relative; aspect-ratio: 744 / 500; background: var(--photo-bg); border-bottom: 1px solid var(--line); overflow: hidden; }
  .photo img { width: 100%; height: 100%; display: block; }
  .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
  .ph svg.ui { width: 34px; height: 34px; stroke-width: 1.4; }
  .quote {
    position: absolute; left: 16px; bottom: 16px; right: 16px;
    background: var(--quote-bg); border: 1px solid var(--line-strong); border-radius: 10px;
    padding: 10px 14px; font-size: 16px; font-weight: 500; font-style: italic; line-height: 1.35; text-wrap: balance;
  }
  .quote::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; background: var(--accent); border-radius: 2px; }
  .quote span { padding-left: 4px; display: block; }

  .panel { padding: 20px 20px 0; display: grid; gap: 18px; }
  .detail { padding: 18px 20px 4px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .sheet h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(34px, 9.4cqi, 44px); line-height: 1.05; letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance;
  }
  .sub { margin: 2px 0 0; font-size: 14px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .grade { display: flex; align-items: flex-end; gap: 12px; }
  .grade .txt { display: grid; text-align: right; line-height: 1.25; }
  .grade .lbl { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .grade .val { font-size: 16px; font-weight: 600; }
  .grade .note { font-size: 12px; color: var(--muted); }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 30px; }
  .bars i { display: block; width: 6px; border-radius: 1.5px; background: color-mix(in srgb, var(--ink) 16%, transparent); }
  .bars i.on { background: var(--accent); }

  .section-label { margin: 0 0 4px; font-size: 12px; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .radar-box { border: 1px solid var(--line); border-radius: 12px; background: var(--raised); padding: 12px 8px 4px; }
  .radar-box .section-label { padding-left: 8px; }
  .radar-empty { padding: 12px 8px 14px; color: var(--muted); font-size: 14px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 2px 8px 0; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 0; display: inline-block; border-top: 2px solid var(--accent); }
  .legend i.base { border-top: 2px dashed var(--muted); }
  .radar { width: 100%; height: auto; display: block; }
  .radar .ring { fill: none; stroke: var(--line-strong); stroke-opacity: 0.66; }
  .radar .spoke { stroke: var(--line); }
  .radar .name { font-family: var(--font-body); font-size: 12px; font-weight: 500; fill: var(--muted); }
  .radar .val { font-family: var(--font-body); font-size: 14px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }

  .groups { display: grid; gap: 20px; }
  .group .section-label { margin: 0 0 8px; font-weight: 500; }
  .rows { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .ico { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--raised); color: var(--ic, var(--accent)); }
  .row.weak .ico { color: var(--ic, var(--warn)); }
  .ico svg, .glyph svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .row .k { display: block; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
  .row .v { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; }
  .row .d { display: block; font-size: 14px; color: var(--muted); line-height: 1.4; margin-top: 1px; }
  .row .k:empty, .row .d:empty { display: none; }
  .foot { padding: 14px 20px 18px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }

  /* Ficha larga (PC): foto, cabeçalho e radar à esquerda; técnicas à direita. */
  @container (min-width: 860px) {
    .card { width: min(1160px, 100%); display: grid; grid-template-columns: minmax(380px, 0.92fr) minmax(0, 1.08fr); }
    .card.solo { width: min(560px, 100%); display: block; }
    .lead { border-right: 1px solid var(--line); }
    .card.solo .lead { border-right: 0; }
    .panel { padding: 24px 28px 28px; gap: 22px; }
    .detail { padding: 28px 28px 12px; }
    .groups { gap: 26px; }
    .sheet h1 { font-size: 48px; }
    .foot { grid-column: 1 / -1; border-top: 1px solid var(--line); padding: 14px 28px; }
  }

  /* ===== Editor ===== */
  .editor { position: fixed; inset: 0; z-index: 50; background: var(--panel); display: flex; flex-direction: column; }
  .ed-head {
    display: flex; align-items: center; gap: 6px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; border-bottom: 1px solid var(--hair);
  }
  .ed-title { flex: 1; font-size: 16px; font-weight: 600; text-align: center; }
  .ed-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 18px calc(48px + env(safe-area-inset-bottom, 0px)); }
  .ed-sec { padding: 22px 0; border-bottom: 1px solid var(--hair); display: grid; gap: 14px; }
  .ed-sec:last-child { border-bottom: 0; }
  .ed-sec > h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .ed-sec > .hint { margin-top: -8px; }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field > .lbl { font-size: 13px; color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); margin: 0; }
  .in {
    width: 100%; min-width: 0; background: rgba(255, 255, 255, 0.035); border: 1px solid var(--hair-2); border-radius: 10px;
    padding: 8px 11px; color: var(--ink); font: inherit; font-size: 16px; line-height: 1.35;
  }
  .in:focus { outline: none; border-color: rgba(255, 255, 255, 0.34); background: rgba(255, 255, 255, 0.055); }
  .in::placeholder { color: #5f5f69; }
  textarea.in { resize: vertical; min-height: 64px; }
  .in.num { text-align: center; padding-inline: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--hair-2); border-radius: 11px; background: rgba(255, 255, 255, 0.03); }
  .seg button { flex: 1; min-width: 0; height: 34px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.11); color: var(--ink); }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; cursor: pointer; user-select: none; }
  .check input { width: 18px; height: 18px; accent-color: #ececf1; margin: 0; }
  .range { width: 100%; accent-color: #ececf1; }

  .img-row { display: grid; grid-template-columns: 148px minmax(0, 1fr); gap: 14px; align-items: center; }
  .img-prev { position: relative; aspect-ratio: 744 / 500; border-radius: 10px; overflow: hidden; border: 1px solid var(--hair-2); background: #18181c; display: grid; place-items: center; color: var(--muted); }
  .img-prev img { width: 100%; height: 100%; display: block; position: absolute; inset: 0; }
  .img-actions { display: grid; gap: 8px; justify-items: start; }

  .color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .swatch { display: flex; align-items: center; gap: 10px; padding: 6px; border: 1px solid var(--hair-2); border-radius: 10px; background: rgba(255, 255, 255, 0.035); }
  .swatch input[type="color"] { width: 34px; height: 30px; border: 0; padding: 0; background: none; border-radius: 6px; cursor: pointer; flex: none; }
  .swatch code { font-size: 14px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }

  .stat-head, .stat { display: grid; grid-template-columns: minmax(0, 1fr) 64px 32px; gap: 8px; align-items: center; }
  .stats.has-base .stat-head, .stats.has-base .stat { grid-template-columns: minmax(0, 1fr) 64px 64px 32px; }
  .stat-head span { font-size: 12px; color: var(--muted); text-align: center; }
  .stat-head span:first-child { text-align: left; }
  .stats { display: grid; gap: 8px; }

  .g-card { border: 1px solid var(--hair-2); border-radius: 14px; overflow: hidden; }
  .g-head { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 10px; background: rgba(255, 255, 255, 0.025); border-bottom: 1px solid var(--hair); }
  .g-head .in { font-weight: 600; background: transparent; border-color: transparent; padding-inline: 6px; }
  .g-head .in:focus { border-color: var(--hair-2); }
  .r-ed { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding: 14px 12px; }
  .r-ed + .r-ed { border-top: 1px solid var(--hair); }
  .r-fields { display: grid; gap: 8px; min-width: 0; }
  .r-top { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 8px; }
  .r-ctrl { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .r-ctrl .spacer { flex: 1; }
  .glyph {
    width: 44px; height: 44px; display: grid; place-items: center; padding: 0;
    border: 1px solid var(--hair-2); border-radius: 10px; background: rgba(255, 255, 255, 0.03); color: var(--glyph, var(--ink));
  }
  .glyph:hover { border-color: rgba(255, 255, 255, 0.3); }
  .mini-color { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); padding: 0 6px; }
  .mini-color input { width: 26px; height: 24px; border: 0; padding: 0; background: none; cursor: pointer; }
  .g-add { padding: 8px 12px 12px; }
  .ed-add { justify-self: start; }

  /* seletor de ícones */
  .ip { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, 0.6); display: grid; place-items: center; padding: 16px; }
  .ip-panel { width: min(560px, 100%); max-height: min(640px, 88vh); display: flex; flex-direction: column; gap: 12px; background: var(--panel); border: 1px solid var(--hair-2); border-radius: 16px; padding: 14px; }
  .ip-head { display: flex; align-items: center; justify-content: space-between; padding-left: 4px; }
  .ip-grid { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 6px; }
  .ip-grid .glyph { width: 100%; height: 50px; }
  .ip-grid .glyph.on { border-color: var(--ink); background: rgba(255, 255, 255, 0.1); }

  /* menu, diálogo, aviso */
  .menu {
    position: fixed; z-index: 80; min-width: 220px; padding: 6px;
    background: #18181c; border: 1px solid var(--hair-2); border-radius: 12px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  }
  .menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 8px; background: none; text-align: left; font-size: 15px; }
  .menu button:hover, .menu button:focus-visible { background: var(--hover); outline: none; }
  .menu button svg.ui { width: 18px; height: 18px; color: var(--muted); }
  .menu button.danger, .menu button.danger svg.ui { color: var(--danger); }
  .menu hr { border: 0; border-top: 1px solid var(--hair); margin: 6px 4px; }

  dialog.confirm {
    width: min(400px, calc(100% - 32px)); padding: 22px; border: 1px solid var(--hair-2); border-radius: 16px;
    background: var(--panel); color: var(--ink); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  }
  dialog.confirm::backdrop { background: rgba(0, 0, 0, 0.6); }
  dialog.confirm h2 { margin: 0 0 6px; font-size: 19px; font-weight: 600; }
  dialog.confirm p { margin: 0 0 20px; color: var(--muted); }
  dialog.confirm .acts { display: flex; justify-content: flex-end; gap: 8px; }
  dialog.confirm .btn.danger-fill { background: var(--danger); color: #1a0606; border-color: transparent; font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 90;
    transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
    padding: 10px 16px; border-radius: 999px; background: #f0f0f4; color: #0b0b0d; font-weight: 500; font-size: 14.5px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1023px) {
    html.lock, html.lock body { overflow: hidden; }
    .app.previewing .editor { display: none; }
  }
  @media (min-width: 1024px) {
    .editor { position: relative; inset: auto; z-index: auto; height: 100vh; border-left: 1px solid var(--hair); }
    .ed-head { padding-top: 12px; }
    .ed-prev { display: none; }
  }
  @media (max-width: 420px) {
    .img-row { grid-template-columns: 1fr; }
    .r-top { grid-template-columns: 1fr; }
  }
</style>

<body>
<div class="app locked" id="app">

    <nav class="list" id="list"></nav>
    <div class="side-foot">
      <button class="btn primary" data-act="new" data-need="edit"></button>
      <button class="icon-btn" data-act="menu" data-ctx="side" data-need="edit" aria-label="Mais opções"></button>

  <div class="scrim" data-act="close-drawer"></div>

  <header class="topbar">
    <button class="icon-btn" data-act="drawer" aria-label="Lista de personagens"></button>
    <div class="brand"><b>Conselho dos Pássaros</b></div>
    <button class="icon-btn" data-act="edit" data-need="edit" aria-label="Editar ficha"></button>
    <button class="icon-btn" data-act="new" data-need="edit" aria-label="Novo personagem"></button>
    <button class="icon-btn" data-act="menu" data-ctx="top" data-need="edit" aria-label="Mais opções"></button>
    <button class="icon-btn" data-act="login" data-need="lock" aria-label="Entrar para editar"></button>
  </header>

  <main class="stage" id="stage">
    <div class="toolbar" id="toolbar">
      <div class="nav">
        <button class="icon-btn" data-act="prev" aria-label="Anterior (seta esquerda)"></button>
        <button class="icon-btn" data-act="next" aria-label="Próximo (seta direita)"></button>
        <span class="pos" id="pos"></span>
        <span class="editing-label" id="editingLabel" hidden>Pré-visualização</span>
      </div>
      <div class="tools" id="tools" data-need="edit">
        <button class="btn" data-act="edit"></button>
        <button class="btn danger" data-act="delete"></button>
      </div>
    </div>
    <nav class="strip" id="strip" aria-label="Troca rápida"></nav>

  </main>

  <section class="editor" id="editor" hidden aria-label="Editor de ficha"></section>
