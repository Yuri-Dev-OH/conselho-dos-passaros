<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conselho dos Pássaros</title>
<meta name="theme-color" content="#0b0b0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
  /* ===== Hub: cromo neutro. A ficha recebe a paleta própria de cada personagem. ===== */
  :root {
    --bg: #0b0b0d;
    --panel: #111114;
    --hair: rgba(255, 255, 255, 0.07);
    --hair-2: rgba(255, 255, 255, 0.12);
    --ink: #ececf1;
    --muted: #8c8c97;
    --hover: rgba(255, 255, 255, 0.045);
    --sel: rgba(255, 255, 255, 0.075);
    --danger: #ff6b6b;
    --stage: #0b0b0d;
    --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --font-body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--stage); color: var(--ink);
    font-family: var(--font-body); font-size: 15px; line-height: 1.45;
    transition: background-color 0.35s ease;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: 0.35; cursor: default; }
  :focus-visible { outline: 2px solid rgba(255, 255, 255, 0.55); outline-offset: 2px; }

  svg.ui { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ic { display: inline-grid; place-items: center; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--hair-2); background: transparent;
    font-size: 15px; font-weight: 500; white-space: nowrap;
    transition: background-color 0.15s, border-color 0.15s;
  }
  .btn:hover:not(:disabled) { background: var(--hover); border-color: rgba(255, 255, 255, 0.2); }
  .btn.primary { background: var(--ink); color: #0b0b0d; border-color: transparent; font-weight: 600; }
  .btn.primary:hover { background: #fff; }
  .btn.ghost { border-color: transparent; }
  .btn.danger { color: var(--danger); }
  .btn.sm { height: 32px; padding: 0 10px; font-size: 14px; }
  .icon-btn {
    width: 38px; height: 38px; flex: none; display: grid; place-items: center;
    border: 0; border-radius: 10px; background: transparent;
  }
  .icon-btn:hover:not(:disabled) { background: var(--hover); }
  .icon-btn.sm { width: 32px; height: 32px; }
  .icon-btn.sm svg.ui { width: 18px; height: 18px; }

  .brand b { display: block; font-family: var(--font-display); font-size: 21px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.05; }
  .brand small { display: block; color: var(--muted); font-size: 13px; }

  /* ===== Layout celular (base) ===== */
  .side {
    position: fixed; inset: 0 auto 0 0; z-index: 40;
    width: min(340px, 88vw); background: var(--panel); border-right: 1px solid var(--hair);
    display: flex; flex-direction: column;
    transform: translateX(-100%); transition: transform 0.25s ease;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .app.drawer-open .side { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 39; background: rgba(0, 0, 0, 0.55); opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .app.drawer-open .scrim { opacity: 1; pointer-events: auto; }

  .side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 20px 14px 14px 20px; }
  .search { position: relative; margin: 0 14px 10px; display: block; }
  .search svg.ui { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; }
  .search input {
    width: 100%; height: 40px; padding: 0 12px 0 36px; border-radius: 10px;
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--hair);
    color: var(--ink); font: inherit; font-size: 16px;
  }
  .search input:focus { outline: none; border-color: rgba(255, 255, 255, 0.28); }
  .list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 10px 12px; display: grid; align-content: start; gap: 2px; }
  .item {
    position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center;
    padding: 8px 10px; border-radius: 12px; color: inherit; text-decoration: none;
    transition: background-color 0.15s;
  }
  .item:hover { background: var(--hover); }
  .item.on { background: var(--sel); }
  .item.on::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--acc); }
  .thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; display: block; background: var(--tbg, #1a1a1f); border: 1px solid var(--hair); }
  .thumb.blank { display: grid; place-items: center; color: var(--muted); }
  .item b { display: block; font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item small { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-empty { padding: 24px 12px; color: var(--muted); text-align: center; font-size: 14px; }
  .side-foot { display: flex; gap: 8px; padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--hair); }
  .side-foot .btn.primary { flex: 1; }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 4px;
    padding: env(safe-area-inset-top, 0px) 8px 0 8px; height: calc(56px + env(safe-area-inset-top, 0px));
    background: color-mix(in srgb, var(--stage) 84%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--hair);
    transition: background-color 0.35s ease;
  }
  .topbar .brand { flex: 1; min-width: 0; padding-left: 4px; }
  .topbar .brand b { font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .strip { display: flex; gap: 10px; overflow-x: auto; padding: 14px 16px 4px; scrollbar-width: none; scroll-padding-inline: 16px; }
  .strip::-webkit-scrollbar { display: none; }
  .chip { flex: none; width: 62px; display: grid; justify-items: center; gap: 6px; text-decoration: none; color: var(--muted); font-size: 12px; line-height: 1.2; }
  .chip .thumb { width: 54px; height: 54px; border-radius: 16px; transition: box-shadow 0.2s; }
  .chip.on { color: var(--ink); }
  .chip.on .thumb { box-shadow: 0 0 0 2px var(--stage), 0 0 0 4px var(--acc); }
  .chip span { max-width: 62px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .stage { padding: 16px 16px calc(40px + env(safe-area-inset-bottom, 0px)); transition: background-color 0.35s ease; }
  .toolbar { display: none; }

  .empty { max-width: 360px; margin: 12vh auto 0; text-align: center; color: var(--muted); display: grid; gap: 14px; justify-items: center; }
  .empty h2 { margin: 0; color: var(--ink); font-family: var(--font-display); text-transform: uppercase; font-size: 30px; }
  .empty p { margin: 0; }

  .preview-pill {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 45;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  .app:not(.previewing) .preview-pill { display: none; }
  .app.is-editing .topbar .icon-btn { visibility: hidden; }
  .app.locked [data-need="edit"], .app:not(.locked) [data-need="lock"] { display: none !important; }
  .side-foot .btn[data-act="login"] { flex: 1; }
  dialog.confirm .in { margin-top: 4px; }
  .login-err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 8px 0 12px !important; }

  /* ===== Layout PC ===== */
  @media (min-width: 1024px) {
    body { overflow: hidden; }
    .app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100vh; }
    .app { grid-template-rows: 100vh; }
    .side { position: relative; inset: auto; width: auto; height: 100vh; min-height: 0; transform: none; transition: none; z-index: auto; padding-top: 0; }
    .topbar, .strip, .scrim, .side-close, .preview-pill { display: none !important; }
    .stage { height: 100vh; overflow-y: auto; padding: 0 36px 56px; }
    .toolbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      height: 64px; margin: 0 -36px 12px; padding: 0 36px;
      background: color-mix(in srgb, var(--stage) 82%, transparent);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      transition: background-color 0.35s ease;
    }
    .toolbar .nav, .toolbar .tools { display: flex; align-items: center; gap: 6px; }
    .toolbar .pos { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; margin-left: 6px; }
    .toolbar .editing-label { color: var(--muted); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
    .app.is-editing { grid-template-columns: minmax(0, 1fr) 500px; }
    .app.is-editing .side { display: none; }
  }

  /* ===== Ficha (porta fiel do modelo original, escopada em .sheet) ===== */
  .sheet { container-type: inline-size; color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
  .sheet.enter { animation: enter 0.28s ease both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .sheet.enter { animation: none; } * { transition-duration: 0s !important; } }

  .card {
    width: min(460px, 100%); margin: 0 auto;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 16px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 24px 60px rgba(0, 0, 0, 0.5);
    overflow: clip;
  }
  .photo { position: relative; aspect-ratio: 744 / 500; background: var(--photo-bg); border-bottom: 1px solid var(--line); overflow: hidden; }
  .photo img { width: 100%; height: 100%; display: block; }
  .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
  .ph svg.ui { width: 34px; height: 34px; stroke-width: 1.4; }
  .quote {
    position: absolute; left: 16px; bottom: 16px; right: 16px;
    background: var(--quote-bg); border: 1px solid var(--line-strong); border-radius: 10px;
    padding: 10px 14px; font-size: 16px; font-weight: 500; font-style: italic; line-height: 1.35; text-wrap: balance;
  }
  .quote::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; background: var(--accent); border-radius: 2px; }
  .quote span { padding-left: 4px; display: block; }
  .quote.has-audio { display: flex; align-items: center; gap: 12px; padding-right: 8px; }
  .quote.has-audio span { flex: 1; min-width: 0; }
  .quote.only-audio { right: auto; padding: 6px; }
  .quote.only-audio::before { display: none; }
  .audio-btn {
    flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
    display: grid; place-items: center; background: var(--accent); color: #0b0b0d;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .audio-btn:hover { filter: brightness(1.1); }
  .audio-btn:active { transform: scale(0.94); }
  .audio-btn:focus-visible, .media-swap:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .audio-btn svg.ui { width: 18px; height: 18px; stroke-width: 2.4; }
  .audio-btn:not(.on) svg.ui { fill: currentColor; stroke-width: 1.2; transform: translateX(1px); }
  .media-swap {
    position: absolute; top: 12px; right: 12px; z-index: 1; height: 32px; padding: 0 12px 0 9px;
    display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; cursor: pointer;
    background: var(--quote-bg); border: 1px solid var(--line-strong); color: var(--ink);
    font: 600 12px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase;
  }
  .media-swap:hover { border-color: var(--accent); }
  .media-swap svg.ui { width: 16px; height: 16px; }

  .panel { padding: 20px 20px 0; display: grid; gap: 18px; }
  .detail { padding: 18px 20px 4px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .sheet h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(34px, 9.4cqi, 44px); line-height: 1.05; letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance;
  }
  .side-tag {
    display: inline-block; margin: 0 0 8px; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor;
    font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.3;
  }
  .side-tag.heroi { color: #6cc4ff; }
  .side-tag.vilao { color: #ff6b6b; }
  .side-tag.neutro { color: #b9b9c4; }
  .sub { margin: 2px 0 0; font-size: 14px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .grade { display: flex; align-items: flex-end; gap: 12px; }
  .grade .txt { display: grid; text-align: right; line-height: 1.25; }
  .grade .lbl { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .grade .val { font-size: 16px; font-weight: 600; }
  .grade .note { font-size: 12px; color: var(--muted); }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 30px; }
  .bars i { display: block; width: 6px; border-radius: 1.5px; background: color-mix(in srgb, var(--ink) 16%, transparent); }
  .bars i.on { background: var(--accent); }

  .section-label { margin: 0 0 4px; font-size: 12px; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .radar-box { border: 1px solid var(--line); border-radius: 12px; background: var(--raised); padding: 12px 8px 4px; }
  .radar-box .section-label { padding-left: 8px; }
  .radar-empty { padding: 12px 8px 14px; color: var(--muted); font-size: 14px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 2px 8px 0; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 0; display: inline-block; border-top: 2px solid var(--accent); }
  .legend i.base { border-top: 2px dashed var(--muted); }
  .forms { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 8px 4px; }
  .forms button {
    font: inherit; font-size: 12px; font-weight: 500; min-height: 32px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line-strong); background: transparent; color: var(--muted);
  }
  .forms button:hover { color: var(--ink); }
  .forms button[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .forms button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .radar { width: 100%; height: auto; display: block; }
  .radar .ring { fill: none; stroke: var(--line-strong); stroke-opacity: 0.66; }
  .radar .spoke { stroke: var(--line); }
  .radar .name { font-family: var(--font-body); font-size: 12px; font-weight: 500; fill: var(--muted); }
  .radar .val { font-family: var(--font-body); font-size: 14px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }

  .groups { display: grid; gap: 20px; }
  .group .section-label { margin: 0 0 8px; font-weight: 500; }
  .rows { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .ico { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--raised); color: var(--ic, var(--accent)); }
  .row.weak .ico { color: var(--ic, var(--warn)); }
  .ico svg, .glyph svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .row .k { display: block; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
  .row .v { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; }
  .row .d { display: block; font-size: 14px; color: var(--muted); line-height: 1.4; margin-top: 1px; }
  .row .k:empty, .row .d:empty { display: none; }
  .foot { padding: 14px 20px 18px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }

  /* Ficha larga (PC): foto, cabeçalho e radar à esquerda; técnicas à direita. */
  @container (min-width: 860px) {
    .card { width: min(1160px, 100%); display: grid; grid-template-columns: minmax(380px, 0.92fr) minmax(0, 1.08fr); }
    .card.solo { width: min(560px, 100%); display: block; }
    .lead { border-right: 1px solid var(--line); }
    .card.solo .lead { border-right: 0; }
    .panel { padding: 24px 28px 28px; gap: 22px; }
    .detail { padding: 28px 28px 12px; }
    .groups { gap: 26px; }
    .sheet h1 { font-size: 48px; }
    .foot { grid-column: 1 / -1; border-top: 1px solid var(--line); padding: 14px 28px; }
  }

  /* ===== Editor ===== */
  .editor { position: fixed; inset: 0; z-index: 50; background: var(--panel); display: flex; flex-direction: column; }
  .ed-head {
    display: flex; align-items: center; gap: 6px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; border-bottom: 1px solid var(--hair);
  }
  .ed-title { flex: 1; font-size: 16px; font-weight: 600; text-align: center; }
  .ed-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 18px calc(48px + env(safe-area-inset-bottom, 0px)); }
  .ed-sec { padding: 22px 0; border-bottom: 1px solid var(--hair); display: grid; gap: 14px; }
  .ed-sec:last-child { border-bottom: 0; }
  .ed-sec > h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .ed-sec > .hint { margin-top: -8px; }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field > .lbl { font-size: 13px; color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); margin: 0; }
  .in {
    width: 100%; min-width: 0; background: rgba(255, 255, 255, 0.035); border: 1px solid var(--hair-2); border-radius: 10px;
    padding: 8px 11px; color: var(--ink); font: inherit; font-size: 16px; line-height: 1.35;
  }
  .in:focus { outline: none; border-color: rgba(255, 255, 255, 0.34); background: rgba(255, 255, 255, 0.055); }
  .in::placeholder { color: #5f5f69; }
  textarea.in { resize: vertical; min-height: 64px; }
  .in.num { text-align: center; padding-inline: 4px; }
  .form-ed { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--hair-2); border-radius: 10px; }
  .form-vals { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .fv { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
  .fv span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .form-acts { display: flex; gap: 6px; justify-content: flex-end; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--hair-2); border-radius: 11px; background: rgba(255, 255, 255, 0.03); }
  .seg button { flex: 1; min-width: 0; height: 34px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.11); color: var(--ink); }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; cursor: pointer; user-select: none; }
  .check input { width: 18px; height: 18px; accent-color: #ececf1; margin: 0; }
  .range { width: 100%; accent-color: #ececf1; }

  .img-row { display: grid; grid-template-columns: 148px minmax(0, 1fr); gap: 14px; align-items: center; }
  .img-prev { position: relative; aspect-ratio: 744 / 500; border-radius: 10px; overflow: hidden; border: 1px solid var(--hair-2); background: #18181c; display: grid; place-items: center; color: var(--muted); }
  .img-prev img { width: 100%; height: 100%; display: block; position: absolute; inset: 0; }
  .img-actions { display: grid; gap: 8px; justify-items: start; }
  .media-block { display: grid; gap: 12px; }
  .media-block + .media-block { border-top: 1px solid var(--hair); padding-top: 16px; }
  .media-block h4 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .audio-prev { width: 100%; height: 40px; }
  .btn.busy { opacity: 0.6; pointer-events: none; }

  .color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .swatch { display: flex; align-items: center; gap: 10px; padding: 6px; border: 1px solid var(--hair-2); border-radius: 10px; background: rgba(255, 255, 255, 0.035); }
  .swatch input[type="color"] { width: 34px; height: 30px; border: 0; padding: 0; background: none; border-radius: 6px; cursor: pointer; flex: none; }
  .swatch code { font-size: 14px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }

  .stat-head, .stat { display: grid; grid-template-columns: minmax(0, 1fr) 64px 32px; gap: 8px; align-items: center; }
  .stats.has-base .stat-head, .stats.has-base .stat { grid-template-columns: minmax(0, 1fr) 64px 64px 32px; }
  .stat-head span { font-size: 12px; color: var(--muted); text-align: center; }
  .stat-head span:first-child { text-align: left; }
  .stats { display: grid; gap: 8px; }

  .g-card { border: 1px solid var(--hair-2); border-radius: 14px; overflow: hidden; }
  .g-head { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 10px; background: rgba(255, 255, 255, 0.025); border-bottom: 1px solid var(--hair); }
  .g-head .in { font-weight: 600; background: transparent; border-color: transparent; padding-inline: 6px; }
  .g-head .in:focus { border-color: var(--hair-2); }
  .r-ed { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding: 14px 12px; }
  .r-ed + .r-ed { border-top: 1px solid var(--hair); }
  .r-fields { display: grid; gap: 8px; min-width: 0; }
  .r-top { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 8px; }
  .r-ctrl { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .r-ctrl .spacer { flex: 1; }
  .glyph {
    width: 44px; height: 44px; display: grid; place-items: center; padding: 0;
    border: 1px solid var(--hair-2); border-radius: 10px; background: rgba(255, 255, 255, 0.03); color: var(--glyph, var(--ink));
  }
  .glyph:hover { border-color: rgba(255, 255, 255, 0.3); }
  .mini-color { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); padding: 0 6px; }
  .mini-color input { width: 26px; height: 24px; border: 0; padding: 0; background: none; cursor: pointer; }
  .g-add { padding: 8px 12px 12px; }
  .ed-add { justify-self: start; }

  /* seletor de ícones */
  .ip { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, 0.6); display: grid; place-items: center; padding: 16px; }
  .ip-panel { width: min(560px, 100%); max-height: min(640px, 88vh); display: flex; flex-direction: column; gap: 12px; background: var(--panel); border: 1px solid var(--hair-2); border-radius: 16px; padding: 14px; }
  .ip-head { display: flex; align-items: center; justify-content: space-between; padding-left: 4px; }
  .ip-grid { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 6px; }
  .ip-grid .glyph { width: 100%; height: 50px; }
  .ip-grid .glyph.on { border-color: var(--ink); background: rgba(255, 255, 255, 0.1); }

  /* menu, diálogo, aviso */
  .menu {
    position: fixed; z-index: 80; min-width: 220px; padding: 6px;
    background: #18181c; border: 1px solid var(--hair-2); border-radius: 12px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  }
  .menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 8px; background: none; text-align: left; font-size: 15px; }
  .menu button:hover, .menu button:focus-visible { background: var(--hover); outline: none; }
  .menu button svg.ui { width: 18px; height: 18px; color: var(--muted); }
  .menu button.danger, .menu button.danger svg.ui { color: var(--danger); }
  .menu hr { border: 0; border-top: 1px solid var(--hair); margin: 6px 4px; }

  dialog.confirm {
    width: min(400px, calc(100% - 32px)); padding: 22px; border: 1px solid var(--hair-2); border-radius: 16px;
    background: var(--panel); color: var(--ink); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  }
  dialog.confirm::backdrop { background: rgba(0, 0, 0, 0.6); }
  dialog.confirm h2 { margin: 0 0 6px; font-size: 19px; font-weight: 600; }
  dialog.confirm p { margin: 0 0 20px; color: var(--muted); }
  dialog.confirm .acts { display: flex; justify-content: flex-end; gap: 8px; }
  dialog.confirm .btn.danger-fill { background: var(--danger); color: #1a0606; border-color: transparent; font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 90;
    transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
    padding: 10px 16px; border-radius: 999px; background: #f0f0f4; color: #0b0b0d; font-weight: 500; font-size: 14.5px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1023px) {
    html.lock, html.lock body { overflow: hidden; }
    .app.previewing .editor { display: none; }
  }
  @media (min-width: 1024px) {
    .editor { position: relative; inset: auto; z-index: auto; height: 100vh; border-left: 1px solid var(--hair); }
    .ed-head { padding-top: 12px; }
    .ed-prev { display: none; }
  }
  @media (max-width: 420px) {
    .img-row { grid-template-columns: 1fr; }
    .r-top { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app locked" id="app">
  <aside class="side" id="side" aria-label="Personagens">
    <div class="side-head">
      <div class="brand"><b>Conselho dos Pássaros</b><small id="count"></small></div>
      <button class="icon-btn side-close" data-act="close-drawer" aria-label="Fechar lista"></button>
    </div>
    <label class="search"><input id="q" type="search" placeholder="Buscar personagem" autocomplete="off" aria-label="Buscar personagem"></label>
    <nav class="list" id="list"></nav>
    <div class="side-foot">
      <button class="btn primary" data-act="new" data-need="edit"></button>
      <button class="icon-btn" data-act="menu" data-ctx="side" data-need="edit" aria-label="Mais opções"></button>
      <button class="btn" data-act="login" data-need="lock"></button>
    </div>
  </aside>
  <div class="scrim" data-act="close-drawer"></div>

  <header class="topbar">
    <button class="icon-btn" data-act="drawer" aria-label="Lista de personagens"></button>
    <div class="brand"><b>Conselho dos Pássaros</b></div>
    <button class="icon-btn" data-act="edit" data-need="edit" aria-label="Editar ficha"></button>
    <button class="icon-btn" data-act="new" data-need="edit" aria-label="Novo personagem"></button>
    <button class="icon-btn" data-act="menu" data-ctx="top" data-need="edit" aria-label="Mais opções"></button>
    <button class="icon-btn" data-act="login" data-need="lock" aria-label="Entrar para editar"></button>
  </header>

  <main class="stage" id="stage">
    <div class="toolbar" id="toolbar">
      <div class="nav">
        <button class="icon-btn" data-act="prev" aria-label="Anterior (seta esquerda)"></button>
        <button class="icon-btn" data-act="next" aria-label="Próximo (seta direita)"></button>
        <span class="pos" id="pos"></span>
        <span class="editing-label" id="editingLabel" hidden>Pré-visualização</span>
      </div>
      <div class="tools" id="tools" data-need="edit">
        <button class="btn" data-act="edit"></button>
        <button class="btn danger" data-act="delete"></button>
      </div>
    </div>
    <nav class="strip" id="strip" aria-label="Troca rápida"></nav>
    <div id="host"></div>
  </main>

  <section class="editor" id="editor" hidden aria-label="Editor de ficha"></section>
  <button class="btn primary preview-pill" data-act="preview">Voltar à edição</button>
</div>

<div class="menu" id="menu" role="menu" hidden></div>
<dialog class="confirm" id="confirm">
  <form method="dialog">
    <h2 id="cfTitle"></h2>
    <p id="cfMsg"></p>
    <div class="acts">
      <button class="btn ghost" value="cancel">Cancelar</button>
      <button class="btn" id="cfOk" value="ok"></button>
    </div>
  </form>
</dialog>
<dialog class="confirm" id="login">
  <form id="loginForm">
    <h2>Modo edição</h2>
    <p id="loginMsg"></p>
    <input class="in" id="loginPw" type="password" autocomplete="current-password" aria-label="Senha">
    <p class="login-err" id="loginErr" role="alert"></p>
    <div class="acts">
      <button class="btn ghost" type="button" id="loginCancel">Cancelar</button>
      <button class="btn primary" type="submit" id="loginOk">Entrar</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
  "use strict";

  /* ===== Constantes ===== */
  /** Ícones das linhas da ficha (vêm do servidor junto com as fichas). */
  let ICONS = {};
  /** Lado do personagem na história. */
  const SIDES = { heroi: "Herói", vilao: "Vilão", neutro: "Neutro" };
  const GRADES = ["Grau 4", "Grau 3", "Grau 2", "Grau 1", "Especial"];
  /* Sessão de edição (token assinado pelo servidor, válido por 1 hora). A senha nunca fica no navegador. */
  const SESSION_KEY = "fichas-sessao";
  const MAX_UPLOAD = 3 * 1024 * 1024;
  const AUDIO_EXT = ["mp3", "ogg", "oga", "opus", "m4a", "aac", "wav", "webm"];
  const DEFAULT_STATS = ["Força", "Velocidade", "Inteligência", "Resistência", "Energia", "Destruição", "Potencial"];
  const UI = {
    search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    more: '<circle cx="5.5" cy="12" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="18.5" cy="12" r="1.1"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
    trash: '<path d="M4.5 7h15M10 4h4M6.5 7l1 13h9l1-13"/><path d="M10 11v5.5M14 11v5.5"/>',
    left: '<path d="M14.5 5.5L8 12l6.5 6.5"/>',
    right: '<path d="M9.5 5.5L16 12l-6.5 6.5"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    up: '<path d="M6 14.5l6-6 6 6"/>',
    down: '<path d="M6 9.5l6 6 6-6"/>',
    image: '<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-9 8.5"/>',
    download: '<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/>',
    upload: '<path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 19.5h14"/>',
    restore: '<path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v3.5H8"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    lock: '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/>',
    logout: '<path d="M14 4.5h4.5a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5H14"/><path d="M10 8l-4 4 4 4M6 12h9"/>',
    play: '<path d="M8 5.5v13l10.5-6.5z"/>',
    pause: '<path d="M9 6v12M15 6v12"/>',
    swap: '<path d="M5 9h13l-3.5-3.5M19 15H6l3.5 3.5"/>',
    audio: '<path d="M4.5 9.5h3l4.5-4v13l-4.5-4h-3z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
  };

  /* ===== Utilitários de DOM ===== */
  const $ = (id) => document.getElementById(id);
  const PROPS = new Set(["value", "checked", "disabled", "hidden", "min", "max", "step"]);

  /**
   * Cria um elemento com atributos, eventos e filhos.
   *
   * @param {string} tag Nome da tag.
   * @param {?Object} props Atributos; "on*" vira listener, "text"/"html" definem conteúdo, "css" define variáveis.
   * @param {...(Node|string|null|false)} kids Filhos.
   * @return {!HTMLElement} O elemento criado.
   */
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k === "html") el.innerHTML = v;
      else if (k === "css") for (const [p, val] of Object.entries(v)) { if (val != null) el.style.setProperty(p, val); }
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (PROPS.has(k)) el[k] = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
    return el;
  }

  /** Ícone de interface (traço) como string SVG. */
  const svg = (name) => '<svg class="ui" viewBox="0 0 24 24" aria-hidden="true">' + UI[name] + "</svg>";
  /** Ícone de interface como elemento. */
  const ic = (name) => h("span", { class: "ic", html: svg(name) });
  /** Ícone da ficha (ICONS) como string SVG. */
  const glyph = (key) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[key] || ICONS.spark || "") + "</svg>";

  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const slug = (s) => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const clone = (o) => (typeof structuredClone === "function" ? structuredClone(o) : JSON.parse(JSON.stringify(o)));

  /* ===== Cores ===== */
  /**
   * Converte "#rgb"/"#rrggbb" em [r, g, b].
   *
   * @param {string} hex Cor hexadecimal.
   * @return {?Array<number>} Componentes ou null se inválida.
   */
  function hexToRgb(hex) {
    const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex || "").trim());
    if (!m) return null;
    let s = m[1];
    if (s.length === 3) s = s.split("").map((c) => c + c).join("");
    const n = parseInt(s, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  const toHex = (rgb) => "#" + rgb.map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
  function rgbToHsl([r, g, b]) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
    if (!d) return [0, 0, l];
    const s = d / (1 - Math.abs(2 * l - 1));
    let hue = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [(hue * 60 + 360) % 360, s, l];
  }
  function hslToRgb(hh, s, l) {
    const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((hh / 60) % 2) - 1)), m = l - c / 2;
    const [r, g, b] = hh < 60 ? [c, x, 0] : hh < 120 ? [x, c, 0] : hh < 180 ? [0, c, x] : hh < 240 ? [0, x, c] : hh < 300 ? [x, 0, c] : [c, 0, x];
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  }
  const hsl = (hh, s, l) => toHex(hslToRgb(hh, s, l));
  const rgba = (rgb, a) => "rgba(" + rgb.map(Math.round).join(", ") + ", " + a + ")";
  /** Normaliza uma cor para "#rrggbb" (exigido por input[type=color]). */
  const hex6 = (c, fallback) => { const rgb = hexToRgb(c); return rgb ? toHex(rgb) : fallback; };

  /**
   * Gera a paleta escura da ficha a partir da cor de destaque, no mesmo espírito das fichas originais.
   *
   * @param {string} accent Cor de destaque.
   * @param {string=} warn Cor das fraquezas.
   * @return {!Object} Tema completo.
   */
  function deriveTheme(accent, warn) {
    const acc = hex6(accent, "#4cc2ff");
    const [hh, s] = rgbToHsl(hexToRgb(acc));
    const bs = Math.min(0.3, s * 0.45);
    const lineRgb = hslToRgb(hh, Math.max(0.25, Math.min(0.75, s)), 0.78);
    return {
      canvas: hsl(hh, bs, 0.04), surface: hsl(hh, bs, 0.07), raised: hsl(hh, bs, 0.105),
      line: rgba(lineRgb, 0.13), lineStrong: rgba(lineRgb, 0.24),
      accent: acc, warn: hex6(warn, "#ffb04c"),
      ink: hsl(hh, Math.min(0.4, s * 0.5), 0.93), muted: hsl(hh, Math.min(0.14, s * 0.2), 0.62),
      photoBg: hsl(hh, bs, 0.06),
    };
  }

  /** Aplica o tema como variáveis CSS no elemento. */
  function applyTheme(el, t) {
    const canvas = hexToRgb(t.canvas) || [11, 11, 13];
    const vars = {
      "--canvas": t.canvas, "--surface": t.surface, "--raised": t.raised, "--line": t.line, "--line-strong": t.lineStrong,
      "--accent": t.accent, "--warn": t.warn, "--ink": t.ink, "--muted": t.muted,
      "--photo-bg": t.photoBg || t.raised, "--quote-bg": rgba(canvas, 0.92),
    };
    for (const [k, v] of Object.entries(vars)) if (v) el.style.setProperty(k, v);
  }

  /* ===== Modelo ===== */
  /** Cria uma ficha vazia pronta para edição. */
  function blankChar() {
    return {
      id: "", name: "", subtitle: "", quote: "", grade: 1, gradeNote: "", role: "", series: "Temporada 1", side: "",
      photo: "", photoAlt: "", photoFit: "cover", photoPos: "50% 0%", photoPad: "",
      logo: "", logoAlt: "", logoFit: "contain", logoPos: "50% 50%", audio: "",
      theme: deriveTheme("#4cc2ff", "#ffb04c"),
      stats: DEFAULT_STATS.map((label) => ({ label, value: 3, base: null })),
      legend: null, forms: null, startForm: 0,
      groups: [{ title: "Técnicas", rows: [] }, { title: "Pontos fracos", rows: [] }],
    };
  }

  /**
   * Aceita só caminhos de mídia seguros: arquivo do site, link https ou data URL (importação antiga).
   *
   * @param {*} v Valor recebido.
   * @return {string} Caminho ou "".
   */
  function mediaPath(v) {
    const p = typeof v === "string" ? v.trim() : "";
    return /^(data:(image|audio)\/|https:\/\/|[\w-][\w\-./]*$)/i.test(p) && !p.includes("..") ? p : "";
  }

  /**
   * Valida e completa uma ficha (do servidor ou de importação).
   *
   * @param {*} raw Objeto lido do JSON.
   * @return {?Object} Ficha normalizada ou null se inválida.
   */
  function normalize(raw) {
    if (!raw || typeof raw !== "object" || typeof raw.name !== "string" || !raw.name.trim()) return null;
    const str = (v) => (typeof v === "string" ? v : "");
    const base = blankChar();
    const accent = hex6(raw.theme && raw.theme.accent, base.theme.accent);
    const theme = Object.assign(deriveTheme(accent, raw.theme && raw.theme.warn), raw.theme && typeof raw.theme === "object" ? raw.theme : {});
    for (const k of Object.keys(theme)) if (typeof theme[k] !== "string") delete theme[k];
    const num = (v) => (typeof v === "number" && isFinite(v) ? clamp(v, 0, 5) : null);
    return {
      id: slug(str(raw.id) || raw.name) || "personagem",
      name: raw.name.trim(), subtitle: str(raw.subtitle), quote: str(raw.quote),
      grade: clamp(Math.round(Number(raw.grade) || 1), 1, 5), gradeNote: str(raw.gradeNote),
      role: str(raw.role), series: str(raw.series), side: SIDES[raw.side] ? raw.side : "",
      photo: mediaPath(raw.photo), photoAlt: str(raw.photoAlt), photoFit: raw.photoFit === "contain" ? "contain" : "cover",
      photoPos: str(raw.photoPos) || "50% 0%", photoPad: str(raw.photoPad),
      logo: mediaPath(raw.logo), logoAlt: str(raw.logoAlt), logoFit: raw.logoFit === "cover" ? "cover" : "contain",
      logoPos: str(raw.logoPos) || "50% 50%", audio: mediaPath(raw.audio),
      theme,
      stats: (Array.isArray(raw.stats) ? raw.stats : []).filter((s) => s && typeof s === "object")
        .map((s) => ({ label: str(s.label), value: num(s.value) ?? 0, base: num(s.base) })),
      legend: Array.isArray(raw.legend) && raw.legend.length === 2 ? raw.legend.map(str) : null,
      forms: Array.isArray(raw.forms) && raw.forms.length >= 2 ? raw.forms.filter((f) => f && typeof f === "object").map((f) => ({
        chip: str(f.chip), name: str(f.name), values: (Array.isArray(f.values) ? f.values : []).map((v) => num(v) ?? 0),
      })) : null,
      startForm: Number.isInteger(raw.startForm) ? raw.startForm : 0,
      groups: (Array.isArray(raw.groups) ? raw.groups : []).filter((g) => g && typeof g === "object").map((g) => ({
        title: str(g.title),
        rows: (Array.isArray(g.rows) ? g.rows : []).filter((r) => r && typeof r === "object").map((r) => {
          const row = { icon: str(r.icon) || "spark", label: str(r.label), value: str(r.value), desc: str(r.desc), weak: !!r.weak };
          if (hexToRgb(r.color)) row.color = r.color;
          return row;
        }),
      })),
    };
  }

  /* ===== Servidor ===== */
  const session = { token: null, exp: 0, timer: 0 };

  /**
   * Chama a API do hub.
   *
   * @param {string} method Método HTTP.
   * @param {string} url Rota relativa (ex.: "api/fichas").
   * @param {*=} body Corpo JSON.
   * @return {!Promise<!Object>} Resposta.
   * @throws {Error} Com mensagem pronta para o usuário.
   */
  async function api(method, url, body) {
    let res;
    try {
      res = await fetch(url, {
        method,
        headers: Object.assign({ "Content-Type": "application/json" }, session.token ? { Authorization: "Bearer " + session.token } : {}),
        body: body === undefined ? undefined : JSON.stringify(body),
      });
    } catch (e) {
      throw new Error("Sem conexão com o servidor. Confira a internet e tente de novo.");
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* resposta sem JSON */ }
    if (res.status === 401 && session.token) endSession();
    if (!res.ok || !data) throw new Error((data && data.erro) || "O servidor não respondeu (" + res.status + "). Tente de novo.");
    return data;
  }

  /** Converte um Blob em base64 (sem o prefixo data:). */
  const toBase64 = (blob) => new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1] || "");
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });

  /* ===== Mídia (foto, logo e áudio) ===== */
  const media = { local: new Map(), rawBase: null };
  /** URL para exibir um caminho de mídia; arquivos recém-enviados usam a cópia local. */
  const mediaSrc = (p) => media.local.get(p) || p;

  /**
   * Se um arquivo recém-enviado ainda não chegou ao site (deploy em andamento),
   * tenta a cópia direta do repositório; se falhar de novo, chama onFail.
   *
   * @param {!HTMLElement} el img ou audio.
   * @param {string} p Caminho de mídia.
   * @param {function()=} onFail Chamado quando não há mais alternativa.
   * @return {!HTMLElement} O próprio elemento.
   */
  function withFallback(el, p, onFail) {
    el.addEventListener("error", () => {
      if (media.rawBase && !el.dataset.raw && !/^(https?:|data:|blob:)/.test(p)) {
        el.dataset.raw = "1";
        el.src = media.rawBase + p;
        if (el.play && player.audio === el) el.play().catch(() => {});
      } else if (onFail) {
        onFail();
      }
    });
    return el;
  }

  /* Áudio da fala: um só tocando por vez. */
  const player = { audio: null, id: null, btn: null };

  function paintAudioBtn() {
    const btn = player.btn;
    if (!btn) return;
    const on = !!player.audio && !player.audio.paused;
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-label", on ? "Pausar fala" : "Ouvir fala");
    btn.title = on ? "Pausar fala" : "Ouvir fala";
    btn.replaceChildren(ic(on ? "pause" : "play"));
  }

  function stopAudio() {
    if (player.audio) player.audio.pause();
    player.audio = player.id = null;
    paintAudioBtn();
  }

  /**
   * Toca ou pausa a fala de um personagem.
   *
   * @param {!Object} c Ficha.
   * @param {!HTMLElement} btn Botão que controla o áudio.
   */
  function toggleAudio(c, btn) {
    player.btn = btn;
    if (player.id === c.id && player.audio) {
      if (player.audio.paused) player.audio.play().catch(() => {});
      else player.audio.pause();
      return;
    }
    stopAudio();
    player.btn = btn;
    const a = withFallback(new Audio(mediaSrc(c.audio)), c.audio, () => {
      if (player.audio === a) stopAudio();
      toast("Não foi possível tocar o áudio. Confira o caminho do arquivo.");
    });
    player.audio = a;
    player.id = c.id;
    a.addEventListener("play", paintAudioBtn);
    a.addEventListener("pause", paintAudioBtn);
    a.addEventListener("ended", paintAudioBtn);
    a.play().catch((e) => { if (e.name === "NotAllowedError") toast("O navegador bloqueou o áudio. Toque de novo."); });
    paintAudioBtn();
  }

  /* ===== Estado ===== */
  const state = { chars: [], currentId: null, query: "", editing: null, unlocked: false, online: false, view: {}, form: {} };
  const app = $("app"), host = $("host"), stage = $("stage"), editorEl = $("editor");

  const byId = (id) => state.chars.find((c) => c.id === id) || null;
  const current = () => byId(state.currentId);
  const sortChars = () => state.chars.sort((a, b) => a.name.localeCompare(b.name, "pt", { sensitivity: "base" }));
  const isDesktop = () => matchMedia("(min-width: 1024px)").matches;

  /** Gera um id único a partir de uma base. */
  function uniqueId(base) {
    const b = base || "personagem";
    let id = b, n = 2;
    while (byId(id)) id = b + "-" + n++;
    return id;
  }

  /* ===== Renderização da ficha ===== */
  /**
   * Monta o radar de atributos (N vértices = N atributos).
   *
   * @param {!Object} c Ficha (rótulos e cores).
   * @param {!Array<number>} vals Valores da forma principal.
   * @param {?Array<number>} baseVals Valores da forma tracejada, ou null.
   * @param {!Array<string>} names Nomes [principal, tracejada] para leitores de tela.
   * @return {!SVGElement} O SVG.
   */
  function radar(c, vals, baseVals, names) {
    const NS = "http://www.w3.org/2000/svg";
    const svgEl = document.createElementNS(NS, "svg");
    svgEl.setAttribute("viewBox", "0 0 340 248");
    svgEl.setAttribute("class", "radar");
    svgEl.setAttribute("role", "img");
    const n = c.stats.length, max = 5, cx = 170, cy = 124, R = 80;
    const ang = (i) => ((-90 + (360 / n) * i) * Math.PI) / 180;
    const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
    const el = (tag, a, text) => {
      const e = document.createElementNS(NS, tag);
      for (const k in a) e.setAttribute(k, a[k]);
      if (text !== undefined) e.textContent = text;
      svgEl.appendChild(e);
      return e;
    };
    const poly = (vals) => vals.map((v, i) => pt(i, (R * clamp(v, 0, max)) / max).map((q) => q.toFixed(1)).join(",")).join(" ");
    for (let l = 1; l <= max; l++) el("polygon", { points: poly(c.stats.map(() => l)), class: "ring", "stroke-width": l === max ? 1.2 : 1 });
    c.stats.forEach((_, i) => {
      const [x, y] = pt(i, R);
      el("line", { x1: cx, y1: cy, x2: x.toFixed(1), y2: y.toFixed(1), class: "spoke", "stroke-width": 1 });
    });
    el("polygon", { points: poly(vals), fill: c.theme.accent, "fill-opacity": 0.2, stroke: c.theme.accent, "stroke-width": 1.8, "stroke-linejoin": "round" });
    if (baseVals) {
      el("polygon", { points: poly(baseVals), fill: c.theme.muted, "fill-opacity": 0.14, stroke: c.theme.muted, "stroke-width": 1.6, "stroke-dasharray": "4 3", "stroke-linejoin": "round" });
    }
    vals.forEach((v, i) => {
      const [x, y] = pt(i, (R * clamp(v, 0, max)) / max);
      el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: 3, fill: c.theme.accent, stroke: c.theme.raised, "stroke-width": 1.5 });
    });
    c.stats.forEach((s, i) => {
      const [x, y] = pt(i, R + 18), co = Math.cos(ang(i)), si = Math.sin(ang(i));
      const anchor = co > 0.25 ? "start" : co < -0.25 ? "end" : "middle";
      const dy = si < -0.5 ? -10 : si > 0.5 ? 4 : -4;
      el("text", { x: x.toFixed(1), y: (y + dy).toFixed(1), "text-anchor": anchor, class: "name" }, s.label);
      el("text", { x: x.toFixed(1), y: (y + dy + 15).toFixed(1), "text-anchor": anchor, class: "val" }, String(vals[i]));
    });
    const list = (v) => c.stats.map((s, i) => s.label + " " + v[i]).join(", ");
    svgEl.setAttribute("aria-label", "Atributos" + (names[0] ? " em " + names[0] : "") + ": " + list(vals) +
      (baseVals ? ". " + (names[1] || "Base") + ": " + list(baseVals) : ""));
    return svgEl;
  }

  /**
   * Monta a ficha completa de um personagem.
   *
   * @param {!Object} c Ficha.
   * @return {!HTMLElement} Elemento article.sheet.
   */
  function renderSheet(c) {
    const sheet = h("article", { class: "sheet", "aria-label": "Ficha de " + (c.name || "personagem") });
    applyTheme(sheet, c.theme);
    const grade = clamp(c.grade || 1, 1, 5), gradeLabel = GRADES[grade - 1];

    const photo = h("div", { class: "photo" });
    const both = !!(c.photo && c.logo);
    let showLogo = !!c.logo && (!c.photo || state.view[c.id] === "logo");
    const paintPic = () => {
      const src = showLogo ? c.logo : c.photo;
      const fit = showLogo ? c.logoFit : c.photoFit, contain = fit === "contain";
      const pic = src ? withFallback(h("img", {
        class: "pic", src: mediaSrc(src), alt: (showLogo ? c.logoAlt : c.photoAlt) || "", decoding: "async",
        css: {
          "object-fit": contain ? "contain" : "cover",
          "object-position": (showLogo ? c.logoPos : c.photoPos) || "50% 0%",
          padding: contain && !showLogo ? c.photoPad || null : null,
        },
      }), src) : h("div", { class: "ph pic" }, ic("image"), "Sem imagem");
      const old = photo.querySelector(".pic");
      old ? old.replaceWith(pic) : photo.prepend(pic);
    };
    paintPic();
    if (both) {
      const swap = h("button", { type: "button", class: "media-swap" });
      const paintSwap = () => {
        swap.replaceChildren(ic("swap"), showLogo ? "Ver foto" : "Ver logo");
        swap.setAttribute("aria-label", showLogo ? "Mostrar a foto" : "Mostrar a logo");
      };
      swap.addEventListener("click", () => {
        showLogo = !showLogo;
        state.view[c.id] = showLogo ? "logo" : "photo";
        paintPic();
        paintSwap();
      });
      paintSwap();
      photo.append(swap);
    }
    if (c.quote || c.audio) {
      let btn = null;
      if (c.audio) {
        btn = h("button", { type: "button", class: "audio-btn", onclick: () => toggleAudio(c, btn) });
        if (player.id === c.id) {
          player.btn = btn;
          paintAudioBtn();
        } else {
          btn.append(ic("play"));
          btn.setAttribute("aria-label", "Ouvir fala");
          btn.title = "Ouvir fala";
        }
      }
      photo.append(h("div", { class: "quote" + (c.audio ? (c.quote ? " has-audio" : " only-audio") : "") },
        c.quote && h("span", { text: "“" + c.quote + "”" }), btn));
    }

    const bars = h("div", { class: "bars", role: "img", "aria-label": "Classificação: " + gradeLabel });
    for (let i = 0; i < 5; i++) bars.append(h("i", { class: i < grade ? "on" : null, css: { height: 10 + i * 5 + "px" } }));

    const head = h("div", { class: "head" },
      h("div", null, SIDES[c.side] && h("span", { class: "side-tag " + c.side, text: SIDES[c.side] }), h("h1", { text: c.name || "Sem nome" }), c.subtitle && h("p", { class: "sub", text: c.subtitle })),
      h("div", { class: "grade" },
        h("div", { class: "txt" },
          h("span", { class: "lbl", text: "Classificação" }),
          h("span", { class: "val", text: gradeLabel }),
          c.gradeNote && h("span", { class: "note", text: c.gradeNote })),
        bars));

    const radarBox = h("div", { class: "radar-box" }, h("p", { class: "section-label", text: "Atributos · escala de 0 a 5" }));
    const forms = formsOf(c);
    if (c.stats.length < 3) {
      radarBox.append(h("p", { class: "radar-empty", text: "Adicione ao menos 3 atributos para formar o gráfico." }));
    } else if (forms) {
      // Posturas: a primeira é a base, tracejada por baixo das demais.
      let idx = clamp(state.form[c.id] ?? c.startForm ?? 0, 0, forms.length - 1);
      const bar = h("div", { class: "forms", role: "group", "aria-label": "Postura" });
      const legend = h("div", { class: "legend" });
      const slot = h("div");
      const draw = () => {
        const f = forms[idx], base = forms[0];
        slot.replaceChildren(radar(c, f.values, idx ? base.values : null, [f.name, base.name]));
        legend.replaceChildren(h("span", null, h("i"), f.name), idx > 0 && h("span", null, h("i", { class: "base" }), base.name));
        [...bar.children].forEach((b, k) => b.setAttribute("aria-pressed", String(k === idx)));
      };
      forms.forEach((f, k) => bar.append(h("button", {
        type: "button", text: f.chip || f.name || "Postura " + (k + 1),
        onclick: () => { idx = k; state.form[c.id] = k; draw(); },
      })));
      draw();
      radarBox.append(bar, legend, slot);
    } else {
      const withBase = !!c.legend && c.stats.every((s) => s.base != null);
      if (withBase) {
        radarBox.append(h("div", { class: "legend" },
          h("span", null, h("i"), c.legend[0]),
          h("span", null, h("i", { class: "base" }), c.legend[1])));
      }
      radarBox.append(radar(c, c.stats.map((s) => Number(s.value) || 0), withBase ? c.stats.map((s) => Number(s.base) || 0) : null, withBase ? c.legend : []));
    }

    const lead = h("div", { class: "lead" }, photo, h("section", { class: "panel" }, head, radarBox));

    const groups = c.groups.filter((g) => g.rows.length);
    const card = h("div", { class: "card" + (groups.length ? "" : " solo") }, lead);
    if (groups.length) {
      const wrap = h("div", { class: "groups" });
      for (const g of groups) {
        const ul = h("ul", { class: "rows" });
        for (const r of g.rows) {
          ul.append(h("li", { class: "row" + (r.weak ? " weak" : ""), css: { "--ic": r.color || null } },
            h("span", { class: "ico", html: glyph(r.icon) }),
            h("span", null,
              h("span", { class: "k", text: r.label || "" }),
              h("span", { class: "v", text: r.value || "" }),
              h("span", { class: "d", text: r.desc || "" }))));
        }
        wrap.append(h("section", { class: "group" }, h("h2", { class: "section-label", text: g.title }), ul));
      }
      card.append(h("div", { class: "detail" }, wrap));
    }
    card.append(h("div", { class: "foot" }, h("span", { text: c.role || "" }), h("span", { text: c.series || "" })));
    sheet.append(card);
    return sheet;
  }

  /**
   * Posturas válidas da ficha, com um valor por atributo (faltantes viram 0).
   *
   * @param {!Object} c Ficha.
   * @return {?Array<{chip: string, name: string, values: !Array<number>}>} Posturas ou null.
   */
  function formsOf(c) {
    if (!Array.isArray(c.forms) || c.forms.length < 2) return null;
    return c.forms.map((f) => ({ chip: f.chip, name: f.name || f.chip, values: c.stats.map((_, i) => Number(f.values[i]) || 0) }));
  }

  /* ===== Renderização do hub ===== */
  /** Miniatura do personagem (foto recortada ou marcador). */
  function thumb(c) {
    // Logo primeiro: é leve, e as fotos podem ter vários MB.
    const src = c.logo || c.photo;
    if (!src) return h("span", { class: "thumb blank", html: svg("image"), css: { "--tbg": c.theme.raised } });
    const [fit, pos] = c.logo ? [c.logoFit, c.logoPos] : [c.photoFit, c.photoPos];
    return withFallback(h("img", {
      class: "thumb", src: mediaSrc(src), alt: "", loading: "lazy", decoding: "async",
      css: { "--tbg": c.theme.photoBg && c.theme.photoBg.startsWith("#") ? c.theme.photoBg : c.theme.raised, "object-position": fit === "contain" ? "50% 40%" : pos || "50% 0%" },
    }), src);
  }

  function renderList() {
    const q = norm(state.query.trim());
    const list = state.chars.filter((c) => !q || norm(c.name + " " + c.subtitle + " " + c.role + " " + (SIDES[c.side] || "")).includes(q));
    $("list").replaceChildren(...(list.length ? list.map((c) => h("a", {
      class: "item" + (c.id === state.currentId ? " on" : ""), href: "#" + c.id,
      "aria-current": c.id === state.currentId ? "true" : null, css: { "--acc": c.theme.accent },
    }, thumb(c), h("span", null, h("b", { text: c.name }), h("small", { text: c.subtitle || GRADES[c.grade - 1] })))) :
      [h("p", { class: "list-empty", text: state.chars.length ? "Nenhum personagem encontrado." : "Nenhuma ficha ainda." })]));
    $("count").textContent = (state.chars.length === 1 ? "1 ficha" : state.chars.length + " fichas") +
      (state.unlocked ? " · edição até " + new Date(session.exp).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "");
  }

  function renderStrip() {
    const strip = $("strip");
    strip.replaceChildren(...state.chars.map((c) => h("a", {
      class: "chip" + (c.id === state.currentId ? " on" : ""), href: "#" + c.id,
      "aria-label": c.name, "aria-current": c.id === state.currentId ? "true" : null, css: { "--acc": c.theme.accent },
    }, thumb(c), h("span", { text: c.name.split(" ")[0] }))));
    strip.hidden = state.chars.length === 0 || !!state.editing;
    const on = strip.querySelector(".chip.on");
    if (on) strip.scrollTo({ left: on.offsetLeft - strip.clientWidth / 2 + on.offsetWidth / 2 });
  }

  /**
   * Desenha a área principal: a ficha atual ou o rascunho em edição.
   *
   * @param {boolean=} animate Se aplica a animação de entrada.
   */
  function renderStage(animate) {
    const c = state.editing ? state.editing.draft : current();
    if (player.id && (!c || c.id !== player.id)) stopAudio();
    const idx = state.chars.findIndex((x) => x.id === state.currentId);
    $("pos").textContent = state.chars.length ? idx + 1 + " de " + state.chars.length : "";
    for (const b of document.querySelectorAll('[data-act="prev"], [data-act="next"]')) b.disabled = state.chars.length < 2;
    for (const b of document.querySelectorAll('[data-act="edit"], [data-act="delete"]')) b.disabled = !current();
    $("tools").hidden = !!state.editing;
    $("pos").hidden = !!state.editing;
    $("editingLabel").hidden = !state.editing;
    for (const b of document.querySelectorAll('.toolbar .nav .icon-btn')) b.hidden = !!state.editing;

    if (!c) {
      document.documentElement.style.setProperty("--stage", "#0b0b0d");
      host.replaceChildren(h("div", { class: "empty" },
        h("h2", { text: "Nenhuma ficha" }),
        h("p", { text: state.unlocked ? "Crie o primeiro personagem." : "Ainda não há personagens publicados." }),
        h("button", { class: "btn primary", "data-act": "new", "data-need": "edit" }, ic("plus"), "Novo personagem")));
      return;
    }
    document.documentElement.style.setProperty("--stage", c.theme.canvas);
    const sheet = renderSheet(c);
    if (animate) sheet.classList.add("enter");
    host.replaceChildren(sheet);
  }

  function renderAll(animate) {
    renderList();
    renderStrip();
    renderStage(animate);
  }

  /**
   * Seleciona um personagem e atualiza a URL (#id).
   *
   * @param {?string} id Id desejado; cai no primeiro se não existir.
   * @param {boolean=} animate Se anima a troca.
   */
  function select(id, animate = true) {
    const c = byId(id) || state.chars[0] || null;
    const changed = (c && c.id) !== state.currentId;
    state.currentId = c ? c.id : null;
    const hash = c ? "#" + c.id : "";
    if (location.hash !== hash) history.replaceState(null, "", hash || location.pathname + location.search);
    renderAll(animate && changed);
    if (changed) {
      stage.scrollTop = 0;
      if (!isDesktop()) window.scrollTo(0, 0);
    }
  }

  function step(dir) {
    if (state.chars.length < 2 || state.editing) return;
    const i = state.chars.findIndex((c) => c.id === state.currentId);
    select(state.chars[(i + dir + state.chars.length) % state.chars.length].id);
  }

  /* ===== Avisos, menu e confirmação ===== */
  let toastTimer = 0;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  /**
   * Abre o diálogo de confirmação.
   *
   * @param {{title: string, message: string, ok: string, danger: (boolean|undefined)}} opts Textos.
   * @return {!Promise<boolean>} true se confirmado.
   */
  function confirmBox(opts) {
    const dlg = $("confirm");
    $("cfTitle").textContent = opts.title;
    $("cfMsg").textContent = opts.message;
    const ok = $("cfOk");
    ok.textContent = opts.ok;
    ok.className = "btn " + (opts.danger ? "danger-fill" : "primary");
    dlg.returnValue = "";
    return new Promise((resolve) => {
      dlg.addEventListener("close", () => resolve(dlg.returnValue === "ok"), { once: true });
      dlg.showModal();
      ok.focus();
    });
  }

  const menu = $("menu");
  let menuAnchor = null;
  function openMenu(anchor, items) {
    menu.replaceChildren(...items.map((it) => (it === "-" ? h("hr") : h("button", {
      role: "menuitem", class: it.danger ? "danger" : null, disabled: it.disabled,
      onclick: () => { closeMenu(); it.run(); },
    }, ic(it.icon), it.label))));
    menu.hidden = false;
    menuAnchor = anchor;
    const r = anchor.getBoundingClientRect();
    const left = clamp(r.right - menu.offsetWidth, 8, innerWidth - menu.offsetWidth - 8);
    let top = r.bottom + 6;
    if (top + menu.offsetHeight > innerHeight - 8) top = r.top - menu.offsetHeight - 6;
    menu.style.left = left + "px";
    menu.style.top = Math.max(8, top) + "px";
    const first = menu.querySelector("button:not(:disabled)");
    if (first) first.focus();
  }
  function closeMenu() {
    menu.hidden = true;
    menuAnchor = null;
  }
  function menuItems(ctx) {
    const data = [
      { icon: "download", label: "Exportar backup (.json)", run: exportAll, disabled: !state.chars.length },
      { icon: "upload", label: "Importar backup", run: () => $("importFile").click() },
      "-",
      { icon: "logout", label: "Sair do modo edição", run: logout },
    ];
    if (ctx !== "top") return data;
    return [
      { icon: "edit", label: "Editar ficha", run: ACTIONS.edit, disabled: !current() },
      { icon: "trash", label: "Excluir ficha", run: ACTIONS.delete, danger: true, disabled: !current() },
      "-", ...data,
    ];
  }

  /* ===== CRUD ===== */
  async function removeCurrent() {
    const c = current();
    if (!c) return;
    const ok = await confirmBox({
      title: "Excluir " + c.name + "?",
      message: "A ficha sai do site para todos. Dá para recuperá-la pelo histórico do GitHub.",
      ok: "Excluir", danger: true,
    });
    if (!ok) return;
    const i = state.chars.indexOf(c);
    toast("Excluindo…");
    try {
      applyData(await api("DELETE", "api/fichas?id=" + encodeURIComponent(c.id)));
    } catch (e) {
      toast(e.message);
      return;
    }
    select((state.chars[Math.min(i, state.chars.length - 1)] || {}).id);
    toast(c.name + " excluído");

  /** Baixa um arquivo gerado no navegador. */

    const a = h("a", { href: url, download: name });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

    const data = { app: "conselho-dos-passaros", version: 1, exportedAt: new Date().toISOString(), characters: state.chars };
    download("fichas-backup-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(data), "application/json");
  }

  /* ===== Dados e sessão ===== */
  /** Aplica a resposta do servidor (ícones + fichas). */
  function applyData(data) {

    media.rawBase = data.rawBase || null;
    state.chars = (data.characters || []).map(normalize).filter(Boolean);
    sortChars();

  /** Busca as fichas na API; em hospedagem estática, lê o dados.json (só leitura). */
  async function loadData() {
    try {
      applyData(await api("GET", "api/fichas" + (state.unlocked ? "?t=" + Date.now() : "")));
      state.online = true;
    } catch (e) {
      state.online = false;
      try {
        const r = await fetch("dados.json", { cache: "no-cache" });
        applyData(await r.json());
      } catch (e2) {
        state.chars = [];
        toast("Não foi possível carregar as fichas");
      }
    }
  }

  /**
   * Libera o CRUD até a expiração do token.
   *
   * @param {{token: string, exp: number}} s Sessão emitida pelo servidor.
   */
  function startSession(s) {
    session.token = s.token;
    session.exp = s.exp;
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) { /* só dura esta aba */ }
    clearTimeout(session.timer);
    session.timer = setTimeout(() => endSession("Sua hora de edição acabou. Entre de novo para continuar."), Math.min(s.exp - Date.now(), 2147483647));
    state.unlocked = true;
    app.classList.remove("locked");
    renderList();
  }

  /**
   * Volta ao modo leitura. O editor aberto continua aberto para não perder o rascunho;
   * ao salvar, a senha é pedida de novo.
   *
   * @param {string=} msg Aviso opcional.
   */
  function endSession(msg) {
    session.token = null;
    session.exp = 0;
    clearTimeout(session.timer);
    try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* ignorado */ }
    state.unlocked = false;
    app.classList.add("locked");
    renderList();
    if (msg) toast(msg);
  }

  function logout() {
    endSession();
    if (state.editing) closeEditor();
    select(state.currentId, false);
    toast("Modo leitura");
  }

  function openLogin() {
    $("loginMsg").textContent = state.online ? "Digite a senha para criar, editar e excluir fichas. A edição fica liberada por 1 hora." :
      "A edição só funciona no endereço da Vercel. Esta cópia do site é apenas para leitura.";
    $("loginPw").hidden = $("loginOk").hidden = !state.online;
    $("loginPw").value = "";
    $("loginErr").textContent = "";
    $("login").showModal();
    if (state.online) $("loginPw").focus();
  }

  async function submitLogin(e) {
    e.preventDefault();
    const btn = $("loginOk");
    btn.disabled = true;
    $("loginErr").textContent = "";
    try {
      startSession(await api("POST", "api/login", { senha: $("loginPw").value }));
      $("login").close();
      if (!state.editing) {
        await loadData();
        select(state.currentId, false);
      }
      toast(state.editing ? "Edição liberada. Agora é só salvar." : "Edição liberada por 1 hora");
    } catch (err) {
      $("loginErr").textContent = err.message;
      $("loginPw").select();
    } finally {
      btn.disabled = false;
    }
  }

  async function importFrom(file) {
    if (!state.unlocked) return openLogin();
    let list;
    try {
      const data = JSON.parse(await file.text());
      list = (Array.isArray(data) ? data : data && data.characters || []).map(normalize).filter(Boolean);
      if (!list.length) throw new Error("vazio");
    } catch (e) {
      toast("Arquivo inválido para importação");
      return;
    }
    toast("Importando…");
    try {
      // Backups antigos trazem imagens embutidas: vão para midia/ antes de salvar as fichas.
      for (const c of list) {
        for (const kind of ["photo", "logo", "audio"]) {
          const m = /^data:(?:image|audio)\/([\w+.-]+);base64,(.+)$/.exec(c[kind]);
          if (!m) continue;
          const ext = { jpeg: "jpg", "svg+xml": "svg", mpeg: "mp3" }[m[1]] || m[1];
          c[kind] = (await api("POST", "api/midia", { id: c.id, kind, ext, data: m[2] })).path;
        }
      }
      applyData(await api("POST", "api/fichas", { characters: list }));
    } catch (e) {
      toast(e.message);
      return;
    }
    select(state.currentId || list[0].id, false);
    toast(list.length + (list.length === 1 ? " ficha importada" : " fichas importadas"));
  }

  /**
   * Prepara uma imagem para envio: reduz para no máximo 1600 px de largura (SVG e GIF vão como estão).
   *
   * @param {!File} file Arquivo de imagem.
   * @return {!Promise<{blob: !Blob, ext: string}>} Arquivo pronto e extensão.
   */
  async function readImage(file) {
    if (file.type === "image/svg+xml" || file.type === "image/gif") return { blob: file, ext: file.type === "image/gif" ? "gif" : "svg" };
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((resolve, reject) => {
        const i = new Image();
        i.onload = () => resolve(i);
        i.onerror = reject;
        i.src = url;
      });
      const scale = Math.min(1, 1600 / img.naturalWidth);
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.naturalWidth * scale);
      cv.height = Math.round(img.naturalHeight * scale);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      const webp = file.type === "image/png" || file.type === "image/webp";
      const blob = await new Promise((resolve) => cv.toBlob(resolve, webp ? "image/webp" : "image/jpeg", webp ? 0.9 : 0.86));
      if (!blob) throw new Error("conversão");
      return { blob, ext: blob.type === "image/webp" ? "webp" : "jpg" };
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  /* ===== Editor ===== */
  let previewQueued = false;
  function changed() {
    if (!state.editing) return;
    state.editing.dirty = true;
    if (previewQueued) return;
    previewQueued = true;
    requestAnimationFrame(() => { previewQueued = false; if (state.editing) renderStage(false); });
  }

  function openEditor(c, isNew) {
    closeMenu();
    closeDrawer();
    state.editing = { draft: clone(c), isNew, dirty: false, pending: {} };
    app.classList.add("is-editing");
    document.documentElement.classList.add("lock");
    editorEl.hidden = false;
    buildEditor();
    renderAll(false);
    stage.scrollTop = 0;
    const first = editorEl.querySelector("input.in");
    if (first && isDesktop()) first.focus();
  }

  function closeEditor() {
    const ed = state.editing;
    if (ed) for (const p of Object.values(ed.pending)) if (![...media.local.values()].includes(p.url)) URL.revokeObjectURL(p.url);
    state.editing = null;
    app.classList.remove("is-editing", "previewing");
    document.documentElement.classList.remove("lock");
    editorEl.hidden = true;
    editorEl.replaceChildren();
    renderAll(false);
  }

  async function cancelEditor() {
    if (state.editing && state.editing.dirty) {
      const ok = await confirmBox({ title: "Descartar alterações?", message: "As mudanças feitas nesta ficha serão perdidas.", ok: "Descartar", danger: true });
      if (!ok) return;
    }
    closeEditor();
  }

  async function saveEditor() {
    const ed = state.editing;
    const d = ed.draft;
    d.name = d.name.trim();
    if (!d.name) {
      app.classList.remove("previewing");
      document.documentElement.classList.add("lock");
      toast("Dê um nome ao personagem");
      const nameInput = editorEl.querySelector("[data-field=name]");
      if (nameInput) nameInput.focus();
      return;
    }
    if (!state.unlocked) {
      toast("Entre com a senha para salvar");
      return openLogin();
    }
    if (ed.isNew && !d.id) d.id = uniqueId(slug(d.name));
    const keep = d.stats.map((st) => !!st.label.trim());
    d.stats = d.stats.filter((_, i) => keep[i]);
    if (d.forms) for (const f of d.forms) f.values = f.values.filter((_, i) => keep[i]);
    if (d.forms) d.startForm = clamp(d.startForm || 0, 0, d.forms.length - 1);
    const btn = editorEl.querySelector('[data-act="save"]');
    btn.classList.add("busy");
    btn.textContent = "Salvando…";
    let id;
    try {
      // Arquivos escolhidos no editor só sobem agora, para não deixar lixo se a edição for cancelada.
      for (const [kind, p] of Object.entries(ed.pending)) {
        if (d[kind] !== p.url) continue;
        const { path } = await api("POST", "api/midia", { id: d.id, kind, ext: p.ext, data: await toBase64(p.blob) });
        media.local.set(path, p.url);
        d[kind] = path;
        delete ed.pending[kind];
      }
      const data = await api("PUT", "api/fichas", { char: d, novo: ed.isNew });
      applyData(data);
      id = data.id;
    } catch (e) {
      toast(e.message);
      btn.classList.remove("busy");
      btn.textContent = "Salvar";
      return;
    }
    state.currentId = id;
    closeEditor();
    select(id, false);
    toast(ed.isNew ? "Personagem criado" : "Ficha salva");
  }

   * @param {!Blob} blob Conteúdo.

  function setPending(kind, blob, ext) {

      toast("Arquivo acima de 3 MB. Reduza o tamanho e tente de novo.");
      return false;
