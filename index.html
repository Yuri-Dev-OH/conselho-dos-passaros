<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="dados.js"></script>
<script>
(() => {
  "use strict";

  /* ===== Constantes ===== */
  const SEED = window.FICHAS_SEED || { version: 1, icons: {}, characters: [] };
  const ICONS = SEED.icons;
  const GRADES = ["Grau 4", "Grau 3", "Grau 2", "Grau 1", "Especial"];
  /* Senha do modo edição: só o hash PBKDF2-SHA256. Gere com "node ferramentas/definir-senha.js"; nunca escreva a senha aqui. */
  const SENHA = /*SENHA*/ { salt: "", hash: "", iter: 210000 } /*FIM-SENHA*/;
  const SESSION_KEY = "fichas-modo-edicao";
  const DEFAULT_STATS = ["Força", "Velocidade", "Inteligência", "Resistência", "Energia", "Destruição", "Potencial"];
  const UI = {
    search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    more: '<circle cx="5.5" cy="12" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="18.5" cy="12" r="1.1"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
    trash: '<path d="M4.5 7h15M10 4h4M6.5 7l1 13h9l1-13"/><path d="M10 11v5.5M14 11v5.5"/>',
    left: '<path d="M14.5 5.5L8 12l6.5 6.5"/>',
    right: '<path d="M9.5 5.5L16 12l-6.5 6.5"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    up: '<path d="M6 14.5l6-6 6 6"/>',
    down: '<path d="M6 9.5l6 6 6-6"/>',
    image: '<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-9 8.5"/>',
    download: '<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/>',
    upload: '<path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 19.5h14"/>',
    restore: '<path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v3.5H8"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    lock: '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/>',
    logout: '<path d="M14 4.5h4.5a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5H14"/><path d="M10 8l-4 4 4 4M6 12h9"/>',
    publish: '<path d="M7 18.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9.5"/><path d="M12 20v-8M9 14.5l3-3 3 3"/>',
  };

  /* ===== Utilitários de DOM ===== */
  const $ = (id) => document.getElementById(id);
  const PROPS = new Set(["value", "checked", "disabled", "hidden", "min", "max", "step"]);

  /**
   * Cria um elemento com atributos, eventos e filhos.
   *
   * @param {string} tag Nome da tag.
   * @param {?Object} props Atributos; "on*" vira listener, "text"/"html" definem conteúdo, "css" define variáveis.
   * @param {...(Node|string|null|false)} kids Filhos.
   * @return {!HTMLElement} O elemento criado.
   */
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k === "html") el.innerHTML = v;
      else if (k === "css") for (const [p, val] of Object.entries(v)) { if (val != null) el.style.setProperty(p, val); }
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (PROPS.has(k)) el[k] = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
    return el;
  }

  /** Ícone de interface (traço) como string SVG. */
  const svg = (name) => '<svg class="ui" viewBox="0 0 24 24" aria-hidden="true">' + UI[name] + "</svg>";
  /** Ícone de interface como elemento. */
  const ic = (name) => h("span", { class: "ic", html: svg(name) });
  /** Ícone da ficha (ICONS) como string SVG. */
  const glyph = (key) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[key] || ICONS.spark || "") + "</svg>";

  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const slug = (s) => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const clone = (o) => (typeof structuredClone === "function" ? structuredClone(o) : JSON.parse(JSON.stringify(o)));

  /* ===== Cores ===== */
  /**
   * Converte "#rgb"/"#rrggbb" em [r, g, b].
   *
   * @param {string} hex Cor hexadecimal.
   * @return {?Array<number>} Componentes ou null se inválida.
   */
  function hexToRgb(hex) {
    const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex || "").trim());
    if (!m) return null;
    let s = m[1];
    if (s.length === 3) s = s.split("").map((c) => c + c).join("");
    const n = parseInt(s, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  const toHex = (rgb) => "#" + rgb.map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
  function rgbToHsl([r, g, b]) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
    if (!d) return [0, 0, l];
    const s = d / (1 - Math.abs(2 * l - 1));
    let hue = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [(hue * 60 + 360) % 360, s, l];
  }
  function hslToRgb(hh, s, l) {
    const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((hh / 60) % 2) - 1)), m = l - c / 2;
    const [r, g, b] = hh < 60 ? [c, x, 0] : hh < 120 ? [x, c, 0] : hh < 180 ? [0, c, x] : hh < 240 ? [0, x, c] : hh < 300 ? [x, 0, c] : [c, 0, x];
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  }
  const hsl = (hh, s, l) => toHex(hslToRgb(hh, s, l));
  const rgba = (rgb, a) => "rgba(" + rgb.map(Math.round).join(", ") + ", " + a + ")";
  /** Normaliza uma cor para "#rrggbb" (exigido por input[type=color]). */
  const hex6 = (c, fallback) => { const rgb = hexToRgb(c); return rgb ? toHex(rgb) : fallback; };

  /**
   * Gera a paleta escura da ficha a partir da cor de destaque, no mesmo espírito das fichas originais.
   *
   * @param {string} accent Cor de destaque.
   * @param {string=} warn Cor das fraquezas.
   * @return {!Object} Tema completo.
   */
  function deriveTheme(accent, warn) {
    const acc = hex6(accent, "#4cc2ff");
    const [hh, s] = rgbToHsl(hexToRgb(acc));
    const bs = Math.min(0.3, s * 0.45);
    const lineRgb = hslToRgb(hh, Math.max(0.25, Math.min(0.75, s)), 0.78);
    return {
      canvas: hsl(hh, bs, 0.04), surface: hsl(hh, bs, 0.07), raised: hsl(hh, bs, 0.105),
      line: rgba(lineRgb, 0.13), lineStrong: rgba(lineRgb, 0.24),
      accent: acc, warn: hex6(warn, "#ffb04c"),
      ink: hsl(hh, Math.min(0.4, s * 0.5), 0.93), muted: hsl(hh, Math.min(0.14, s * 0.2), 0.62),
      photoBg: hsl(hh, bs, 0.06),
    };
  }

  /** Aplica o tema como variáveis CSS no elemento. */
  function applyTheme(el, t) {
    const canvas = hexToRgb(t.canvas) || [11, 11, 13];
    const vars = {
      "--canvas": t.canvas, "--surface": t.surface, "--raised": t.raised, "--line": t.line, "--line-strong": t.lineStrong,
      "--accent": t.accent, "--warn": t.warn, "--ink": t.ink, "--muted": t.muted,
      "--photo-bg": t.photoBg || t.raised, "--quote-bg": rgba(canvas, 0.92),
    };
    for (const [k, v] of Object.entries(vars)) if (v) el.style.setProperty(k, v);
  }

  /* ===== Modelo ===== */
  /** Cria uma ficha vazia pronta para edição. */
  function blankChar() {
    return {
      id: "", name: "", subtitle: "", quote: "", grade: 1, gradeNote: "", role: "", series: "Temporada 1",
      photo: "", photoAlt: "", photoFit: "cover", photoPos: "50% 0%", photoPad: "",
      theme: deriveTheme("#4cc2ff", "#ffb04c"),
      stats: DEFAULT_STATS.map((label) => ({ label, value: 3, base: null })),
      legend: null,
      groups: [{ title: "Técnicas", rows: [] }, { title: "Pontos fracos", rows: [] }],
    };
  }

  /**
   * Valida e completa uma ficha vinda de importação.
   *
   * @param {*} raw Objeto lido do JSON.
   * @return {?Object} Ficha normalizada ou null se inválida.
   */
  function normalize(raw) {
    if (!raw || typeof raw !== "object" || typeof raw.name !== "string" || !raw.name.trim()) return null;
    const str = (v) => (typeof v === "string" ? v : "");
    const base = blankChar();
    const accent = hex6(raw.theme && raw.theme.accent, base.theme.accent);
    const theme = Object.assign(deriveTheme(accent, raw.theme && raw.theme.warn), raw.theme && typeof raw.theme === "object" ? raw.theme : {});
    for (const k of Object.keys(theme)) if (typeof theme[k] !== "string") delete theme[k];
    const num = (v) => (typeof v === "number" && isFinite(v) ? clamp(v, 0, 5) : null);
    return {
      id: slug(str(raw.id) || raw.name) || "personagem",
      name: raw.name.trim(), subtitle: str(raw.subtitle), quote: str(raw.quote),
      grade: clamp(Math.round(Number(raw.grade) || 1), 1, 5), gradeNote: str(raw.gradeNote),
      role: str(raw.role), series: str(raw.series),
      photo: /^(data:image\/|https?:|\.{0,2}\/?[\w-])/i.test(str(raw.photo)) ? str(raw.photo) : "",
      photoAlt: str(raw.photoAlt), photoFit: raw.photoFit === "contain" ? "contain" : "cover",
      photoPos: str(raw.photoPos) || "50% 0%", photoPad: str(raw.photoPad),
      theme,
      stats: (Array.isArray(raw.stats) ? raw.stats : []).filter((s) => s && typeof s === "object")
        .map((s) => ({ label: str(s.label), value: num(s.value) ?? 0, base: num(s.base) })),
      legend: Array.isArray(raw.legend) && raw.legend.length === 2 ? raw.legend.map(str) : null,
      groups: (Array.isArray(raw.groups) ? raw.groups : []).filter((g) => g && typeof g === "object").map((g) => ({
        title: str(g.title),
        rows: (Array.isArray(g.rows) ? g.rows : []).filter((r) => r && typeof r === "object").map((r) => {
          const row = { icon: str(r.icon) || "spark", label: str(r.label), value: str(r.value), desc: str(r.desc), weak: !!r.weak };
          if (hexToRgb(r.color)) row.color = r.color;
          return row;
        }),
      })),
    };
  }

  /* ===== Armazenamento (IndexedDB, com fallback em memória) ===== */
  const DB = (() => {
    const mem = { chars: new Map(), meta: new Map() };
    let dbp = null;
    let volatile = false;

    /** Abre (uma vez) o banco local. Resolve null quando indisponível. */
    function open() {
      if (dbp) return dbp;
      dbp = new Promise((resolve) => {
        try {
          const rq = indexedDB.open("conselho-dos-passaros", 1);
          rq.onupgradeneeded = () => {
            rq.result.createObjectStore("chars", { keyPath: "id" });
            rq.result.createObjectStore("meta", { keyPath: "k" });
          };
          rq.onsuccess = () => resolve(rq.result);
          rq.onerror = () => { volatile = true; resolve(null); };
          rq.onblocked = () => { volatile = true; resolve(null); };
        } catch (e) {
          volatile = true;
          resolve(null);
        }
      });
      return dbp;
    }

    /** Executa operações numa transação e espera concluir. */
    async function run(store, mode, fn) {
      const db = await open();
      if (!db) {
        const out = fn(null, mem[store]);
        return out && typeof out === "object" && !Array.isArray(out) && "result" in out ? out.result : out;
      }
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, mode);
        const out = fn(tx.objectStore(store));
        tx.oncomplete = () => resolve(out && typeof out === "object" && "result" in out ? out.result : out);
        tx.onerror = tx.onabort = () => reject(tx.error);
      });
    }

    return {
      get volatile() { return volatile; },
      all: () => run("chars", "readonly", (s, m) => (s ? s.getAll() : [...m.values()].map(clone))),
      putMany: (list) => run("chars", "readwrite", (s, m) => { for (const c of list) s ? s.put(c) : m.set(c.id, clone(c)); }),
      put: (c) => DB.putMany([c]),
      clear: () => run("chars", "readwrite", (s, m) => (s ? s.clear() : m.clear())),
      del: (id) => run("chars", "readwrite", (s, m) => (s ? s.delete(id) : m.delete(id))),
      getMeta: (k) => run("meta", "readonly", (s, m) => (s ? s.get(k) : { result: m.get(k) })).then((r) => (r && r.v !== undefined ? r.v : r)),
      setMeta: (k, v) => run("meta", "readwrite", (s, m) => (s ? s.put({ k, v }) : m.set(k, { k, v }))),
    };
  })();

  /* ===== Estado ===== */
  const state = { chars: [], currentId: null, query: "", editing: null, unlocked: false, dirty: false };
  const app = $("app"), host = $("host"), stage = $("stage"), editorEl = $("editor");

  const byId = (id) => state.chars.find((c) => c.id === id) || null;
  const current = () => byId(state.currentId);
  const sortChars = () => state.chars.sort((a, b) => a.name.localeCompare(b.name, "pt", { sensitivity: "base" }));
  const isDesktop = () => matchMedia("(min-width: 1024px)").matches;

  /** Gera um id único a partir de uma base. */
  function uniqueId(base) {
    const b = base || "personagem";
    let id = b, n = 2;
    while (byId(id)) id = b + "-" + n++;
    return id;
  }

  /* ===== Renderização da ficha ===== */
  /**
   * Monta o radar de atributos (N vértices = N atributos).
   *
   * @param {!Object} c Ficha.
   * @param {boolean} withBase Se desenha a segunda forma tracejada.
   * @return {!SVGElement} O SVG.
   */
  function radar(c, withBase) {
    const NS = "http://www.w3.org/2000/svg";
    const svgEl = document.createElementNS(NS, "svg");
    svgEl.setAttribute("viewBox", "0 0 340 248");
    svgEl.setAttribute("class", "radar");
    svgEl.setAttribute("role", "img");
    const n = c.stats.length, max = 5, cx = 170, cy = 124, R = 80;
    const ang = (i) => ((-90 + (360 / n) * i) * Math.PI) / 180;
    const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
    const el = (tag, a, text) => {
      const e = document.createElementNS(NS, tag);
      for (const k in a) e.setAttribute(k, a[k]);
      if (text !== undefined) e.textContent = text;
      svgEl.appendChild(e);
      return e;
    };
    const poly = (vals) => vals.map((v, i) => pt(i, (R * clamp(v, 0, max)) / max).map((q) => q.toFixed(1)).join(",")).join(" ");
    for (let l = 1; l <= max; l++) el("polygon", { points: poly(c.stats.map(() => l)), class: "ring", "stroke-width": l === max ? 1.2 : 1 });
    c.stats.forEach((_, i) => {
      const [x, y] = pt(i, R);
      el("line", { x1: cx, y1: cy, x2: x.toFixed(1), y2: y.toFixed(1), class: "spoke", "stroke-width": 1 });
    });
    const vals = c.stats.map((s) => Number(s.value) || 0);
    el("polygon", { points: poly(vals), fill: c.theme.accent, "fill-opacity": 0.2, stroke: c.theme.accent, "stroke-width": 1.8, "stroke-linejoin": "round" });
    if (withBase) {
      el("polygon", { points: poly(c.stats.map((s) => Number(s.base) || 0)), fill: c.theme.muted, "fill-opacity": 0.14, stroke: c.theme.muted, "stroke-width": 1.6, "stroke-dasharray": "4 3", "stroke-linejoin": "round" });
    }
    vals.forEach((v, i) => {
      const [x, y] = pt(i, (R * clamp(v, 0, max)) / max);
      el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: 3, fill: c.theme.accent, stroke: c.theme.raised, "stroke-width": 1.5 });
    });
    c.stats.forEach((s, i) => {
      const [x, y] = pt(i, R + 18), co = Math.cos(ang(i)), si = Math.sin(ang(i));
      const anchor = co > 0.25 ? "start" : co < -0.25 ? "end" : "middle";
      const dy = si < -0.5 ? -10 : si > 0.5 ? 4 : -4;
      el("text", { x: x.toFixed(1), y: (y + dy).toFixed(1), "text-anchor": anchor, class: "name" }, s.label);
      el("text", { x: x.toFixed(1), y: (y + dy + 15).toFixed(1), "text-anchor": anchor, class: "val" }, String(s.value));
    });
    svgEl.setAttribute("aria-label", "Atributos: " + c.stats.map((s) => s.label + " " + s.value).join(", ") +
      (withBase ? ". " + c.legend[1] + ": " + c.stats.map((s) => s.label + " " + s.base).join(", ") : ""));
    return svgEl;
  }

  /**
   * Monta a ficha completa de um personagem.
   *
   * @param {!Object} c Ficha.
   * @return {!HTMLElement} Elemento article.sheet.
   */
  function renderSheet(c) {
    const sheet = h("article", { class: "sheet", "aria-label": "Ficha de " + (c.name || "personagem") });
    applyTheme(sheet, c.theme);
    const grade = clamp(c.grade || 1, 1, 5), gradeLabel = GRADES[grade - 1];

    const photo = h("div", { class: "photo" });
    if (c.photo) {
      const contain = c.photoFit === "contain";
      photo.append(h("img", {
        src: c.photo, alt: c.photoAlt || "", decoding: "async",
        css: { "object-fit": contain ? "contain" : "cover", "object-position": c.photoPos || "50% 0%", padding: contain ? c.photoPad || null : null },
      }));
    } else {
      photo.append(h("div", { class: "ph" }, ic("image"), "Sem imagem"));
    }
    if (c.quote) photo.append(h("div", { class: "quote" }, h("span", { text: "“" + c.quote + "”" })));

    const bars = h("div", { class: "bars", role: "img", "aria-label": "Classificação: " + gradeLabel });
    for (let i = 0; i < 5; i++) bars.append(h("i", { class: i < grade ? "on" : null, css: { height: 10 + i * 5 + "px" } }));

    const head = h("div", { class: "head" },
      h("div", null, h("h1", { text: c.name || "Sem nome" }), c.subtitle && h("p", { class: "sub", text: c.subtitle })),
      h("div", { class: "grade" },
        h("div", { class: "txt" },
          h("span", { class: "lbl", text: "Classificação" }),
          h("span", { class: "val", text: gradeLabel }),
          c.gradeNote && h("span", { class: "note", text: c.gradeNote })),
        bars));

    const withBase = !!c.legend && c.stats.length > 0 && c.stats.every((s) => s.base != null);
    const radarBox = h("div", { class: "radar-box" }, h("p", { class: "section-label", text: "Atributos · escala de 0 a 5" }));
    if (withBase) {
      radarBox.append(h("div", { class: "legend" },
        h("span", null, h("i"), c.legend[0]),
        h("span", null, h("i", { class: "base" }), c.legend[1])));
    }
    radarBox.append(c.stats.length >= 3 ? radar(c, withBase) : h("p", { class: "radar-empty", text: "Adicione ao menos 3 atributos para formar o gráfico." }));

    const lead = h("div", { class: "lead" }, photo, h("section", { class: "panel" }, head, radarBox));

    const groups = c.groups.filter((g) => g.rows.length);
    const card = h("div", { class: "card" + (groups.length ? "" : " solo") }, lead);
    if (groups.length) {
      const wrap = h("div", { class: "groups" });
      for (const g of groups) {
        const ul = h("ul", { class: "rows" });
        for (const r of g.rows) {
          ul.append(h("li", { class: "row" + (r.weak ? " weak" : ""), css: { "--ic": r.color || null } },
            h("span", { class: "ico", html: glyph(r.icon) }),
            h("span", null,
              h("span", { class: "k", text: r.label || "" }),
              h("span", { class: "v", text: r.value || "" }),
              h("span", { class: "d", text: r.desc || "" }))));
        }
        wrap.append(h("section", { class: "group" }, h("h2", { class: "section-label", text: g.title }), ul));
      }
      card.append(h("div", { class: "detail" }, wrap));
    }
    card.append(h("div", { class: "foot" }, h("span", { text: c.role || "" }), h("span", { text: c.series || "" })));
    sheet.append(card);
    return sheet;
  }

  /* ===== Renderização do hub ===== */
  /** Miniatura do personagem (foto recortada ou marcador). */
  function thumb(c) {
    if (!c.photo) return h("span", { class: "thumb blank", html: svg("image"), css: { "--tbg": c.theme.raised } });
    return h("img", {
      class: "thumb", src: c.photo, alt: "", loading: "lazy", decoding: "async",
      css: { "--tbg": c.theme.photoBg && c.theme.photoBg.startsWith("#") ? c.theme.photoBg : c.theme.raised, "object-position": c.photoFit === "contain" ? "50% 40%" : c.photoPos || "50% 0%" },
    });
  }

  function renderList() {
    const q = norm(state.query.trim());
    const list = state.chars.filter((c) => !q || norm(c.name + " " + c.subtitle + " " + c.role).includes(q));
    $("list").replaceChildren(...(list.length ? list.map((c) => h("a", {
      class: "item" + (c.id === state.currentId ? " on" : ""), href: "#" + c.id,
      "aria-current": c.id === state.currentId ? "true" : null, css: { "--acc": c.theme.accent },
    }, thumb(c), h("span", null, h("b", { text: c.name }), h("small", { text: c.subtitle || GRADES[c.grade - 1] })))) :
      [h("p", { class: "list-empty", text: state.chars.length ? "Nenhum personagem encontrado." : "Nenhuma ficha ainda." })]));
    $("count").textContent = (state.chars.length === 1 ? "1 ficha" : state.chars.length + " fichas") +
      (state.unlocked ? (state.dirty ? " · alterações não publicadas" : " · modo edição") : "");
  }

  function renderStrip() {
    const strip = $("strip");
    strip.replaceChildren(...state.chars.map((c) => h("a", {
      class: "chip" + (c.id === state.currentId ? " on" : ""), href: "#" + c.id,
      "aria-label": c.name, "aria-current": c.id === state.currentId ? "true" : null, css: { "--acc": c.theme.accent },
    }, thumb(c), h("span", { text: c.name.split(" ")[0] }))));
    strip.hidden = state.chars.length === 0 || !!state.editing;
    const on = strip.querySelector(".chip.on");
    if (on) strip.scrollTo({ left: on.offsetLeft - strip.clientWidth / 2 + on.offsetWidth / 2 });
  }

  /**
   * Desenha a área principal: a ficha atual ou o rascunho em edição.
   *
   * @param {boolean=} animate Se aplica a animação de entrada.
   */
  function renderStage(animate) {
    const c = state.editing ? state.editing.draft : current();
    const idx = state.chars.findIndex((x) => x.id === state.currentId);
    $("pos").textContent = state.chars.length ? idx + 1 + " de " + state.chars.length : "";
    for (const b of document.querySelectorAll('[data-act="prev"], [data-act="next"]')) b.disabled = state.chars.length < 2;
    for (const b of document.querySelectorAll('[data-act="edit"], [data-act="delete"]')) b.disabled = !current();
    $("tools").hidden = !!state.editing;
    $("pos").hidden = !!state.editing;
    $("editingLabel").hidden = !state.editing;
    for (const b of document.querySelectorAll('.toolbar .nav .icon-btn')) b.hidden = !!state.editing;

    if (!c) {
      document.documentElement.style.setProperty("--stage", "#0b0b0d");
      host.replaceChildren(h("div", { class: "empty" },
        h("h2", { text: "Nenhuma ficha" }),
        h("p", { text: "Crie um personagem novo ou restaure as fichas originais." }),
        h("div", { class: "two" },
          h("button", { class: "btn primary", "data-act": "new", "data-need": "edit" }, ic("plus"), "Novo personagem"),
          h("button", { class: "btn", "data-act": "restore", "data-need": "edit" }, ic("restore"), "Restaurar"))));
      return;
    }
    document.documentElement.style.setProperty("--stage", c.theme.canvas);
    const sheet = renderSheet(c);
    if (animate) sheet.classList.add("enter");
    host.replaceChildren(sheet);
  }

  function renderAll(animate) {
    renderList();
    renderStrip();
    renderStage(animate);
  }

  /**
   * Seleciona um personagem e atualiza a URL (#id).
   *
   * @param {?string} id Id desejado; cai no primeiro se não existir.
   * @param {boolean=} animate Se anima a troca.
   */
  function select(id, animate = true) {
    const c = byId(id) || state.chars[0] || null;
    const changed = (c && c.id) !== state.currentId;
    state.currentId = c ? c.id : null;
    const hash = c ? "#" + c.id : "";
    if (location.hash !== hash) history.replaceState(null, "", hash || location.pathname + location.search);
    renderAll(animate && changed);
    if (changed) {
      stage.scrollTop = 0;
      if (!isDesktop()) window.scrollTo(0, 0);
    }
  }

  function step(dir) {
    if (state.chars.length < 2 || state.editing) return;
    const i = state.chars.findIndex((c) => c.id === state.currentId);
    select(state.chars[(i + dir + state.chars.length) % state.chars.length].id);
  }

  /* ===== Avisos, menu e confirmação ===== */
  let toastTimer = 0;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  /**
   * Abre o diálogo de confirmação.
   *
   * @param {{title: string, message: string, ok: string, danger: (boolean|undefined)}} opts Textos.
   * @return {!Promise<boolean>} true se confirmado.
   */
  function confirmBox(opts) {
    const dlg = $("confirm");
    $("cfTitle").textContent = opts.title;
    $("cfMsg").textContent = opts.message;
    const ok = $("cfOk");
    ok.textContent = opts.ok;
    ok.className = "btn " + (opts.danger ? "danger-fill" : "primary");
    dlg.returnValue = "";
    return new Promise((resolve) => {
      dlg.addEventListener("close", () => resolve(dlg.returnValue === "ok"), { once: true });
      dlg.showModal();
      ok.focus();
    });
  }

  const menu = $("menu");
  let menuAnchor = null;
  function openMenu(anchor, items) {
    menu.replaceChildren(...items.map((it) => (it === "-" ? h("hr") : h("button", {
      role: "menuitem", class: it.danger ? "danger" : null, disabled: it.disabled,
      onclick: () => { closeMenu(); it.run(); },
    }, ic(it.icon), it.label))));
    menu.hidden = false;
    menuAnchor = anchor;
    const r = anchor.getBoundingClientRect();
    const left = clamp(r.right - menu.offsetWidth, 8, innerWidth - menu.offsetWidth - 8);
    let top = r.bottom + 6;
    if (top + menu.offsetHeight > innerHeight - 8) top = r.top - menu.offsetHeight - 6;
    menu.style.left = left + "px";
    menu.style.top = Math.max(8, top) + "px";
    const first = menu.querySelector("button:not(:disabled)");
    if (first) first.focus();
  }
  function closeMenu() {
    menu.hidden = true;
    menuAnchor = null;
  }
  function menuItems(ctx) {
    const data = [
      { icon: "publish", label: "Publicar (baixar dados.js)", run: publish, disabled: !state.chars.length },
      { icon: "download", label: "Exportar backup (.json)", run: exportAll, disabled: !state.chars.length },
      { icon: "upload", label: "Importar backup", run: () => $("importFile").click() },
      { icon: "restore", label: "Voltar à versão publicada", run: restoreOriginals },
      "-",
      { icon: "logout", label: "Sair do modo edição", run: logout },
    ];
    if (ctx !== "top") return data;
    return [
      { icon: "edit", label: "Editar ficha", run: ACTIONS.edit, disabled: !current() },
      { icon: "trash", label: "Excluir ficha", run: ACTIONS.delete, danger: true, disabled: !current() },
      "-", ...data,
    ];
  }

  /* ===== CRUD ===== */
  async function removeCurrent() {
    const c = current();
    if (!c) return;
    const ok = await confirmBox({
      title: "Excluir " + c.name + "?",
      message: "A ficha sai do seu rascunho. Seus amigos só deixam de vê-la depois que você publicar.",
      ok: "Excluir", danger: true,
    });
    if (!ok) return;
    const i = state.chars.indexOf(c);
    await DB.del(c.id);
    markDirty();
    state.chars.splice(i, 1);
    select((state.chars[Math.min(i, state.chars.length - 1)] || {}).id);
    toast(c.name + " excluído");
  }

  async function restoreOriginals() {
    const ok = await confirmBox({
      title: "Voltar à versão publicada?",
      message: "As alterações feitas neste navegador e ainda não publicadas serão descartadas.",
      ok: "Descartar e voltar", danger: true,
    });
    if (!ok) return;
    state.chars = await replaceWorkspace();
    sortChars();
    select(state.currentId, false);
    toast("Versão publicada restaurada");
  }

  /** Baixa um arquivo gerado no navegador. */
  function download(name, content, type) {
    const url = URL.createObjectURL(new Blob([content], { type }));
    const a = h("a", { href: url, download: name });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function exportAll() {
    const data = { app: "conselho-dos-passaros", version: 1, exportedAt: new Date().toISOString(), characters: state.chars };
    download("fichas-backup-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(data), "application/json");
  }

  /** Gera o dados.js com o rascunho atual; substituí-lo no repositório atualiza o site. */
  async function publish() {
    const version = Date.now();
    download("dados.js", "/* Dados publicados pelo hub. Para atualizar o site, substitua este arquivo no repositório. */\n" +
      "window.FICHAS_SEED = " + JSON.stringify({ version, icons: ICONS, characters: state.chars }) + ";\n", "text/javascript");
    await DB.setMeta("base", version);
    await DB.setMeta("dirty", false);
    state.dirty = false;
    renderList();
    toast("dados.js baixado. Envie ao GitHub para publicar.");
  }

  /* ===== Modo leitura × modo edição ===== */
  function markDirty() {
    state.dirty = true;
    DB.setMeta("dirty", true).catch(() => {});
  }

  /** Substitui o rascunho local pela versão publicada (dados.js). */
  async function replaceWorkspace() {
    const seed = SEED.characters.map(clone);
    await DB.clear();
    await DB.putMany(seed);
    await DB.setMeta("base", SEED.version || 1);
    await DB.setMeta("dirty", false);
    state.dirty = false;
    return seed;
  }

  /**
   * Carrega o rascunho local. Se o site publicou uma versão mais nova, adota-a
   * (pedindo confirmação quando há alterações locais não publicadas).
   *
   * @return {!Promise<!Array<!Object>>} Fichas do rascunho.
   */
  async function loadWorkspace() {
    const ver = SEED.version || 1;
    try {
      let base = await DB.getMeta("base");
      if (base == null && (await DB.getMeta("seeded"))) {
        base = 1;  // rascunho criado antes do modo senha: preserva
        await DB.setMeta("base", 1);
        await DB.setMeta("dirty", true);
      }
      if (base == null) return await replaceWorkspace();
      state.dirty = !!(await DB.getMeta("dirty"));
      if (ver > base) {
        const take = !state.dirty || await confirmBox({
          title: "O site tem uma versão mais nova",
          message: "Ela foi publicada depois das suas alterações locais. Usar a versão publicada descarta o que não foi publicado neste navegador.",
          ok: "Usar a publicada", danger: true,
        });
        if (take) return await replaceWorkspace();
        await DB.setMeta("base", ver);
      }
      return await DB.all();
    } catch (e) {
      return SEED.characters.map(clone);
    }
  }

  function showPublished() {
    state.unlocked = false;
    state.dirty = false;
    app.classList.add("locked");
    state.chars = SEED.characters.map(clone);
    sortChars();
  }

  async function enterEditMode() {
    state.unlocked = true;
    app.classList.remove("locked");
    state.chars = await loadWorkspace();
    sortChars();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    if (DB.volatile) toast("Armazenamento local indisponível: alterações não serão mantidas");
  }

  function logout() {
    if (state.editing) closeEditor();
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
    showPublished();
    select(state.currentId, false);
    toast("Modo leitura");
  }

  const hexBytes = (hx) => new Uint8Array(hx.match(/../g).map((b) => parseInt(b, 16)));

  /**
   * Confere a senha contra o hash PBKDF2-SHA256 configurado.
   *
   * @param {string} pw Senha digitada.
   * @return {!Promise<boolean>} true se confere.
   */
  async function checkPassword(pw) {
    const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: hexBytes(SENHA.salt), iterations: SENHA.iter }, key, 256);
    return [...new Uint8Array(bits)].map((b) => b.toString(16).padStart(2, "0")).join("") === SENHA.hash;
  }

  function openLogin() {
    const configured = !!SENHA.hash;
    $("loginMsg").textContent = configured ? "Digite a senha para criar, editar e excluir fichas." :
      "A senha ainda não foi configurada. No PC, rode: node ferramentas/definir-senha.js";
    $("loginPw").hidden = $("loginOk").hidden = !configured;
    $("loginPw").value = "";
    $("loginErr").textContent = "";
    $("login").showModal();
    if (configured) $("loginPw").focus();
  }

  async function submitLogin(e) {
    e.preventDefault();
    const btn = $("loginOk");
    btn.disabled = true;
    try {
      if (!(await checkPassword($("loginPw").value))) {
        $("loginErr").textContent = "Senha incorreta.";
        $("loginPw").select();
        return;
      }
      try { sessionStorage.setItem(SESSION_KEY, "1"); } catch (err) {}
      $("login").close();
      await enterEditMode();
      select(state.currentId, false);
      toast("Modo edição ativo");
    } catch (err) {
      $("loginErr").textContent = "Este navegador não permite verificar a senha (abra pelo link https).";
    } finally {
      btn.disabled = false;
    }
  }

  async function importFrom(file) {
    try {
      const data = JSON.parse(await file.text());
      const list = (Array.isArray(data) ? data : data && data.characters || []).map(normalize).filter(Boolean);
      if (!list.length) throw new Error("vazio");
      await DB.putMany(list);
      markDirty();
      for (const c of list) {
        const i = state.chars.findIndex((x) => x.id === c.id);
        i >= 0 ? (state.chars[i] = c) : state.chars.push(c);
      }
      sortChars();
      select(state.currentId || list[0].id, false);
      toast(list.length + (list.length === 1 ? " ficha importada" : " fichas importadas"));
    } catch (e) {
      toast("Arquivo inválido para importação");
    }
  }

  /**
   * Lê uma imagem enviada e a reduz (máx. 1200 px de largura) para caber no armazenamento local.
   *
   * @param {!File} file Arquivo de imagem.
   * @return {!Promise<string>} Data URL.
   */
  async function readImage(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((resolve, reject) => {
        const i = new Image();
        i.onload = () => resolve(i);
        i.onerror = reject;
        i.src = url;
      });
      const scale = Math.min(1, 1200 / img.naturalWidth);
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.naturalWidth * scale);
      cv.height = Math.round(img.naturalHeight * scale);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      return file.type === "image/png" || file.type === "image/webp" ? cv.toDataURL("image/webp", 0.9) : cv.toDataURL("image/jpeg", 0.86);
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  /* ===== Editor ===== */
  let previewQueued = false;
  function changed() {
    if (!state.editing) return;
    state.editing.dirty = true;
    if (previewQueued) return;
    previewQueued = true;
    requestAnimationFrame(() => { previewQueued = false; if (state.editing) renderStage(false); });
  }

  function openEditor(c, isNew) {
    closeMenu();
    closeDrawer();
    state.editing = { draft: clone(c), isNew, dirty: false };
    app.classList.add("is-editing");
    document.documentElement.classList.add("lock");
    editorEl.hidden = false;
    buildEditor();
    renderAll(false);
    stage.scrollTop = 0;
    const first = editorEl.querySelector("input.in");
    if (first && isDesktop()) first.focus();
  }

  function closeEditor() {
    state.editing = null;
    app.classList.remove("is-editing", "previewing");
    document.documentElement.classList.remove("lock");
    editorEl.hidden = true;
    editorEl.replaceChildren();
    renderAll(false);
  }

  async function cancelEditor() {
    if (state.editing && state.editing.dirty) {
      const ok = await confirmBox({ title: "Descartar alterações?", message: "As mudanças feitas nesta ficha serão perdidas.", ok: "Descartar", danger: true });
      if (!ok) return;
    }
    closeEditor();
  }

  async function saveEditor() {
    const ed = state.editing;
    const d = ed.draft;
    d.name = d.name.trim();
    if (!d.name) {
      app.classList.remove("previewing");
      document.documentElement.classList.add("lock");
      toast("Dê um nome ao personagem");
      const nameInput = editorEl.querySelector("[data-field=name]");
      if (nameInput) nameInput.focus();
      return;
    }
    if (ed.isNew) d.id = uniqueId(slug(d.name));
    d.stats = d.stats.filter((s) => s.label.trim());
    try {
      await DB.put(d);
      markDirty();
    } catch (e) {
      toast("Não foi possível salvar (armazenamento cheio?)");
      return;
    }
    const i = state.chars.findIndex((x) => x.id === d.id);
    i >= 0 ? (state.chars[i] = d) : state.chars.push(d);
    sortChars();
    state.currentId = d.id;
    closeEditor();
    select(d.id, false);
    toast(ed.isNew ? "Personagem criado" : "Ficha salva");
  }

  /** Recria o formulário preservando a rolagem (após mudanças estruturais). */
  function rebuild() {
    const body = editorEl.querySelector(".ed-body");
    const top = body ? body.scrollTop : 0;
    buildEditor();
    editorEl.querySelector(".ed-body").scrollTop = top;
  }

  const field = (label, ...control) => h(control.length === 1 && /^(INPUT|TEXTAREA)$/.test(control[0].tagName) ? "label" : "div", { class: "field" }, h("span", { class: "lbl", text: label }), ...control);
  const textIn = (obj, key, attrs = {}) => h("input", Object.assign({
    class: "in", type: "text", value: obj[key] || "", oninput: (e) => { obj[key] = e.target.value; changed(); },
  }, attrs));
  const areaIn = (obj, key, attrs = {}) => {
    const t = h("textarea", Object.assign({ class: "in", rows: 2, oninput: (e) => { obj[key] = e.target.value; changed(); } }, attrs));
    t.value = obj[key] || "";
    return t;
  };
  const numIn = (obj, key, label) => h("input", {
    class: "in num", type: "number", min: 0, max: 5, step: 0.5, inputmode: "decimal", "aria-label": label, value: obj[key] ?? "",
    oninput: (e) => { const v = parseFloat(e.target.value); if (!isNaN(v)) { obj[key] = clamp(v, 0, 5); changed(); } },
    onchange: (e) => { e.target.value = obj[key]; },
  });
  const seg = (options, value, onPick, label) => h("div", { class: "seg", role: "group", "aria-label": label },
    ...options.map(([v, text]) => h("button", { type: "button", "aria-pressed": String(v === value), onclick: () => onPick(v) }, text)));
  const tinyBtn = (icon, label, onclick, disabled) => h("button", { type: "button", class: "icon-btn sm", "aria-label": label, title: label, disabled, onclick }, ic(icon));
  const move = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; changed(); rebuild(); };

  function buildEditor() {
    const ed = state.editing, d = ed.draft;
    const head = h("div", { class: "ed-head" },
      h("button", { class: "btn ghost", "data-act": "cancel" }, "Cancelar"),
      h("strong", { class: "ed-title", text: ed.isNew ? "Nova ficha" : "Editar ficha" }),
      h("button", { class: "btn ghost ed-prev", "data-act": "preview" }, "Prévia"),
      h("button", { class: "btn primary", "data-act": "save" }, "Salvar"));
    const body = h("div", { class: "ed-body" },
      secIdentity(d), secImage(d), secGrade(d), secColors(d), secStats(d), secGroups(d));
    editorEl.replaceChildren(head, body);
  }

  function secIdentity(d) {
    return h("section", { class: "ed-sec" }, h("h3", { text: "Identidade" }),
      field("Nome", textIn(d, "name", { placeholder: "Ex.: Bomba", "data-field": "name", required: true })),
      field("Subtítulo", textIn(d, "subtitle", { placeholder: "Ex.: Tanque Explosivo de Grau 1" })),
      field("Frase", areaIn(d, "quote", { placeholder: "Uma fala marcante do personagem" })),
      h("div", { class: "two" },
        field("Função", textIn(d, "role", { placeholder: "Linha de frente" })),
        field("Série", textIn(d, "series", { placeholder: "Temporada 1" }))));
  }

  function secImage(d) {
    const prev = h("div", { class: "img-prev" });
    const paint = () => {
      prev.replaceChildren(d.photo ? h("img", { src: d.photo, alt: "", css: { "object-fit": d.photoFit, "object-position": d.photoPos } }) : ic("image"));
    };
    paint();
    const file = h("input", {
      type: "file", accept: "image/*", hidden: true,
      onchange: async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        try {
          d.photo = await readImage(f);
          changed();
          rebuild();
        } catch (err) {
          toast("Não foi possível ler a imagem");
        }
      },
    });
    const posY = parseFloat(String(d.photoPos || "50% 0%").split(/\s+/)[1]) || 0;
    const range = h("input", {
      class: "range", type: "range", min: 0, max: 100, step: 1, value: posY, "aria-label": "Enquadramento vertical",
      oninput: (e) => { d.photoPos = "50% " + e.target.value + "%"; paint(); changed(); },
    });
    return h("section", { class: "ed-sec" }, h("h3", { text: "Imagem" }),
      h("div", { class: "img-row" }, prev, h("div", { class: "img-actions" },
        h("button", { type: "button", class: "btn sm", onclick: () => file.click() }, ic("upload"), d.photo ? "Trocar imagem" : "Enviar imagem"),
        d.photo && h("button", { type: "button", class: "btn sm ghost danger", onclick: () => { d.photo = ""; changed(); rebuild(); } }, ic("trash"), "Remover"),
        file)),
      d.photo && field("Ajuste", seg([["cover", "Preencher"], ["contain", "Imagem inteira"]], d.photoFit, (v) => { d.photoFit = v; changed(); rebuild(); }, "Ajuste da imagem")),
      d.photo && d.photoFit === "cover" && field("Enquadramento vertical", range),
      d.photo && field("Descrição da imagem", textIn(d, "photoAlt", { placeholder: "Para leitores de tela" })));
  }

  function secGrade(d) {
    return h("section", { class: "ed-sec" }, h("h3", { text: "Classificação" }),
      seg(GRADES.map((g, i) => [i + 1, g]), d.grade, (v) => { d.grade = v; changed(); rebuild(); }, "Grau"),
      field("Observação", textIn(d, "gradeNote", { placeholder: "Ex.: Mais perigoso quanto mais apanha" })));
  }

  function secColors(d) {
    const swatch = (label, value, onInput) => {
      const code = h("code", { text: value });
      return field(label, h("div", { class: "swatch" },
        h("input", { type: "color", value, "aria-label": label, oninput: (e) => { code.textContent = e.target.value; onInput(e.target.value); } }), code));
    };
    return h("section", { class: "ed-sec" }, h("h3", { text: "Cores" }),
      h("p", { class: "hint", text: "Trocar o destaque recalcula o fundo da ficha no mesmo tom." }),
      h("div", { class: "color-row" },
        swatch("Destaque", hex6(d.theme.accent, "#4cc2ff"), (v) => { d.theme = deriveTheme(v, d.theme.warn); changed(); }),
        swatch("Fraquezas", hex6(d.theme.warn, "#ffb04c"), (v) => { d.theme.warn = v; changed(); })));
  }

  function secStats(d) {
    const hasBase = !!d.legend;
    const toggle = h("label", { class: "check" }, h("input", {
      type: "checkbox", checked: hasBase,
      onchange: (e) => {
        if (e.target.checked) {
          d.legend = ["Forma completa", "Forma base"];
          d.stats.forEach((s) => { if (s.base == null) s.base = s.value; });
        } else {
          d.legend = null;
          d.stats.forEach((s) => { s.base = null; });
        }
        changed();
        rebuild();
      },
    }), "Comparar duas formas no gráfico");

    const list = h("div", { class: "stats" + (hasBase ? " has-base" : "") },
      h("div", { class: "stat-head" }, h("span", { text: "Atributo" }), h("span", { text: hasBase ? d.legend[0] : "Valor" }), hasBase && h("span", { text: d.legend[1] }), h("span")),
      ...d.stats.map((s, i) => h("div", { class: "stat" },
        textIn(s, "label", { placeholder: "Atributo", "aria-label": "Nome do atributo" }),
        numIn(s, "value", "Valor de " + (s.label || "atributo")),
        hasBase && numIn(s, "base", "Valor base de " + (s.label || "atributo")),
        tinyBtn("close", "Remover atributo", () => { d.stats.splice(i, 1); changed(); rebuild(); }, d.stats.length <= 3))));

    return h("section", { class: "ed-sec" }, h("h3", { text: "Atributos · 0 a 5" }),
      toggle,
      hasBase && h("div", { class: "two" },
        field("Legenda da forma principal", textIn(d.legend, 0)),
        field("Legenda da forma tracejada", textIn(d.legend, 1))),
      list,
      h("button", {
        type: "button", class: "btn sm ed-add", disabled: d.stats.length >= 10,
        onclick: () => { d.stats.push({ label: "", value: 3, base: hasBase ? 3 : null }); changed(); rebuild(); },
      }, ic("plus"), "Atributo"));
  }

  function rowEditor(d, g, ri) {
    const r = g.rows[ri];
    const tone = r.color || (r.weak ? d.theme.warn : d.theme.accent);
    const pick = h("button", {
      type: "button", class: "glyph", "aria-label": "Trocar ícone", title: "Trocar ícone", css: { "--glyph": tone }, html: glyph(r.icon),
      onclick: () => openIconPicker(r.icon, (key) => { r.icon = key; changed(); rebuild(); }),
    });
    return h("div", { class: "r-ed" }, pick, h("div", { class: "r-fields" },
      h("div", { class: "r-top" },
        textIn(r, "label", { placeholder: "Tipo (ex.: Passiva)", "aria-label": "Tipo" }),
        textIn(r, "value", { placeholder: "Nome", "aria-label": "Nome" })),
      areaIn(r, "desc", { placeholder: "Descrição", "aria-label": "Descrição" }),
      h("div", { class: "r-ctrl" },
        h("label", { class: "check" }, h("input", { type: "checkbox", checked: r.weak, onchange: (e) => { r.weak = e.target.checked; changed(); rebuild(); } }), "Fraqueza"),
        h("label", { class: "mini-color", title: "Cor do ícone" },
          h("input", { type: "color", value: hex6(tone, "#ffffff"), "aria-label": "Cor do ícone", oninput: (e) => { r.color = e.target.value; pick.style.setProperty("--glyph", r.color); changed(); } }),
          r.color ? h("button", { type: "button", class: "btn sm ghost", onclick: (e) => { e.preventDefault(); delete r.color; changed(); rebuild(); } }, "Auto") : "Cor"),
        h("span", { class: "spacer" }),
        tinyBtn("up", "Mover para cima", () => move(g.rows, ri, -1), ri === 0),
        tinyBtn("down", "Mover para baixo", () => move(g.rows, ri, 1), ri === g.rows.length - 1),
        tinyBtn("trash", "Remover linha", () => { g.rows.splice(ri, 1); changed(); rebuild(); }))));
  }

  function secGroups(d) {
    const cards = d.groups.map((g, gi) => h("div", { class: "g-card" },
      h("div", { class: "g-head" },
        textIn(g, "title", { placeholder: "Título do grupo", "aria-label": "Título do grupo" }),
        tinyBtn("up", "Mover grupo para cima", () => move(d.groups, gi, -1), gi === 0),
        tinyBtn("down", "Mover grupo para baixo", () => move(d.groups, gi, 1), gi === d.groups.length - 1),
        tinyBtn("trash", "Remover grupo", async () => {
          if (g.rows.length && !(await confirmBox({ title: "Remover “" + (g.title || "grupo") + "”?", message: "As " + g.rows.length + " linhas deste grupo serão removidas.", ok: "Remover", danger: true }))) return;
          d.groups.splice(gi, 1);
          changed();
          rebuild();
        })),
      ...g.rows.map((_, ri) => rowEditor(d, g, ri)),
      h("div", { class: "g-add" }, h("button", {
        type: "button", class: "btn sm",
        onclick: () => { g.rows.push({ icon: "spark", label: "", value: "", desc: "", weak: /fraq|fraco|fraca/i.test(norm(g.title)) }); changed(); rebuild(); },
      }, ic("plus"), "Linha"))));
    return h("section", { class: "ed-sec" }, h("h3", { text: "Técnicas e pontos fracos" }),
      ...cards,
      h("button", { type: "button", class: "btn sm ed-add", onclick: () => { d.groups.push({ title: "Novo grupo", rows: [] }); changed(); rebuild(); } }, ic("plus"), "Grupo"));
  }

  /**
   * Abre o seletor de ícones.
   *
   * @param {string} currentKey Ícone atual.
   * @param {function(string)} onPick Callback com a chave escolhida.
   */
  function openIconPicker(currentKey, onPick) {
    const keys = Object.keys(ICONS).sort();
    const grid = h("div", { class: "ip-grid" });
    const paint = (q) => grid.replaceChildren(...keys.filter((k) => k.includes(q)).map((k) => h("button", {
      type: "button", class: "glyph" + (k === currentKey ? " on" : ""), title: k, "aria-label": k, html: glyph(k),
      onclick: () => { close(); onPick(k); },
    })));
    const esc = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
    const wrap = h("div", { class: "ip", onclick: (e) => { if (e.target === wrap) close(); } },
      h("div", { class: "ip-panel", role: "dialog", "aria-modal": "true", "aria-label": "Escolher ícone" },
        h("div", { class: "ip-head" }, h("strong", { text: "Escolher ícone" }), tinyBtn("close", "Fechar", () => close())),
        h("input", { class: "in", type: "search", placeholder: "Filtrar por nome", "aria-label": "Filtrar ícones", oninput: (e) => paint(norm(e.target.value.trim())) }),
        grid));
    function close() {
      wrap.remove();
      document.removeEventListener("keydown", esc, true);
    }
    document.addEventListener("keydown", esc, true);
    paint("");
    document.body.append(wrap);
    if (isDesktop()) wrap.querySelector("input").focus();
  }

  /* ===== Gaveta (celular) ===== */
  function openDrawer(focusSearch) {
    app.classList.add("drawer-open");
    if (focusSearch) setTimeout(() => $("q").focus(), 50);
  }
  function closeDrawer() {
    app.classList.remove("drawer-open");
  }

  /* ===== Ações ===== */
  const ACTIONS = {
    new: () => { if (state.unlocked && !state.editing) openEditor(blankChar(), true); },
    edit: () => { const c = current(); if (c && state.unlocked && !state.editing) openEditor(c, false); },
    delete: () => { if (state.unlocked) removeCurrent(); },
    login: openLogin,
    prev: () => step(-1),
    next: () => step(1),
    menu: (el) => (menuAnchor === el ? closeMenu() : openMenu(el, menuItems(el.dataset.ctx))),
    drawer: () => openDrawer(true),
    "close-drawer": closeDrawer,
    cancel: cancelEditor,
    save: saveEditor,
    restore: () => { if (state.unlocked) restoreOriginals(); },
    preview: () => {
      const on = app.classList.toggle("previewing");
      document.documentElement.classList.toggle("lock", !on);
      window.scrollTo(0, 0);
    },
  };

  function wire() {
    // ícones dos botões estáticos
    document.querySelectorAll('[data-act="close-drawer"].icon-btn').forEach((b) => b.append(ic("close")));
    document.querySelectorAll('.topbar [data-act="drawer"]').forEach((b) => b.append(ic("menu")));
    document.querySelectorAll('.topbar [data-act="edit"]').forEach((b) => b.append(ic("edit")));
    document.querySelectorAll('.topbar [data-act="new"]').forEach((b) => b.append(ic("plus")));
    document.querySelectorAll('[data-act="menu"]').forEach((b) => b.append(ic("more")));
    document.querySelector('[data-act="prev"]').append(ic("left"));
    document.querySelector('[data-act="next"]').append(ic("right"));
    document.querySelector('.tools [data-act="edit"]').append(ic("edit"), "Editar");
    document.querySelector('.tools [data-act="delete"]').append(ic("trash"), "Excluir");
    document.querySelector('.side-foot [data-act="new"]').append(ic("plus"), "Novo personagem");
    document.querySelector('.side-foot [data-act="login"]').append(ic("lock"), "Entrar para editar");
    document.querySelector('.topbar [data-act="login"]').append(ic("lock"));
    $("loginForm").addEventListener("submit", submitLogin);
    $("loginCancel").addEventListener("click", () => $("login").close());
    document.querySelector(".search").prepend(h("span", { class: "ic", html: svg("search") }).firstChild);

    document.addEventListener("click", (e) => {
      const el = e.target.closest("[data-act]");
      if (el && !el.disabled && ACTIONS[el.dataset.act]) {
        e.preventDefault();
        ACTIONS[el.dataset.act](el);
        return;
      }
      const link = e.target.closest("a.item, a.chip");
      if (link) {
        e.preventDefault();
        closeDrawer();
        select(link.getAttribute("href").slice(1));
      }
    });
    document.addEventListener("pointerdown", (e) => {
      if (!menu.hidden && !menu.contains(e.target) && !(menuAnchor && menuAnchor.contains(e.target))) closeMenu();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (!menu.hidden) return closeMenu();
        if (app.classList.contains("drawer-open")) return closeDrawer();
        if (state.editing && !$("confirm").open && !$("login").open) return cancelEditor();
      }
      const typing = e.target.closest && e.target.closest("input, textarea, select, [contenteditable]");
      if (typing || state.editing || e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === "ArrowLeft") step(-1);
      else if (e.key === "ArrowRight") step(1);
    });
    window.addEventListener("hashchange", () => {
      if (!state.editing) select(decodeURIComponent(location.hash.slice(1)));
    });
    $("strip").addEventListener("wheel", (e) => {
      const strip = e.currentTarget;
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX) || strip.scrollWidth <= strip.clientWidth) return;
      e.preventDefault();
      strip.scrollLeft += e.deltaY;
    }, { passive: false });
    $("q").addEventListener("input", (e) => { state.query = e.target.value; renderList(); });
    $("importFile").addEventListener("change", (e) => {
      const f = e.target.files[0];
      e.target.value = "";
      if (f) importFrom(f);
    });

    // deslizar para trocar de personagem (celular)
    let sx = null, sy = 0, st = 0;
    host.addEventListener("touchstart", (e) => {
      if (state.editing || e.touches.length > 1) return;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
    }, { passive: true });
    host.addEventListener("touchend", (e) => {
      if (sx == null) return;
      const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
      sx = null;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2 && Date.now() - st < 700) step(dx < 0 ? 1 : -1);
    }, { passive: true });

    window.addEventListener("beforeunload", (e) => {
      if (state.editing && state.editing.dirty) { e.preventDefault(); e.returnValue = ""; }
    });
  }

  async function init() {
    wire();
    let wantsEdit = false;
    try { wantsEdit = sessionStorage.getItem(SESSION_KEY) === "1"; } catch (e) {}
    if (wantsEdit && SENHA.hash) await enterEditMode();
    else showPublished();
    select(decodeURIComponent(location.hash.slice(1)), false);
  }

  init();
})();
</script>
</body>
</html>
