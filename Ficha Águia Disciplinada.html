<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ficha Águia Disciplinada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
  /* Layout: mesmo modelo da ficha do Passarinho. Foto no topo (com espaço reservado enquanto não há imagem), painel de dados em linhas separadas por filetes. Troque só o objeto CHAR no fim do arquivo. */
  :root {
    --canvas: #080b12;
    --surface: #0e1420;
    --raised: #141c2c;
    --line: rgba(160, 190, 255, 0.13);
    --line-strong: rgba(160, 190, 255, 0.24);
    --accent: #e7b24a;
    --warn: #f0907f;
    --azul: #5aa9ff;
    --vermelho: #ef6a6a;
    --roxo: #a98bff;
    --ink: #e9eef8;
    --muted: #8c9ab2;
    --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --font-body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    justify-content: center;
  }

  .card {
    width: min(460px, 100%);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 16px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 24px 60px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }

  /* foto + frase */
  .photo {
    position: relative; aspect-ratio: 744 / 500; border-bottom: 1px solid var(--line); overflow: hidden;
    background:
      radial-gradient(60% 70% at 50% 42%, rgba(231, 178, 74, 0.13), transparent 70%),
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(160, 190, 255, 0.06) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(160, 190, 255, 0.06) 39px 40px),
      var(--raised);
  }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: 50% 50%; padding: 10px 0 58px; display: block; }
  .quote {
    position: absolute; left: 16px; bottom: 16px; right: 16px;
    background: rgba(8, 11, 18, 0.92);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 16px; font-weight: 500; font-style: italic; line-height: 1.35;
    text-wrap: balance;
  }
  .quote::before {
    content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; background: var(--accent); border-radius: 2px;
  }
  .quote span { padding-left: 4px; display: block; }

  /* cabeçalho */
  .panel { padding: 20px 20px 4px; display: grid; gap: 18px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(34px, 9.4vw, 44px); line-height: 1.05; letter-spacing: 0.01em; text-transform: uppercase;
    text-wrap: balance;
  }
  .sub { margin: 2px 0 0; font-size: 14px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }

  .grade { display: flex; align-items: flex-end; gap: 12px; }
  .grade .txt { display: grid; text-align: right; line-height: 1.2; }
  .grade .lbl { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .grade .val { font-size: 16px; font-weight: 600; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 30px; }
  .bars i { display: block; width: 6px; border-radius: 1.5px; background: rgba(160, 190, 255, 0.16); }
  .bars i.on { background: var(--accent); }

  /* radar */
  .section-label { margin: 0 0 4px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .radar-box { border: 1px solid var(--line); border-radius: 12px; background: var(--raised); padding: 12px 8px 4px; }
  .radar-box .section-label { padding-left: 8px; }
  #radar { width: 100%; height: auto; display: block; }
  #radar text { font-family: var(--font-body); }
  #radar .name { font-size: 12px; font-weight: 500; fill: var(--muted); }
  #radar .val { font-size: 14px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }

  /* linhas de dados */
  .groups { display: grid; gap: 20px; }
  .group .section-label { margin: 0 0 8px; font-weight: 500; }
  .row .k:empty, .row .d:empty { display: none; }
  .rows { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .ico {
    width: 40px; height: 40px; display: grid; place-items: center;
    border: 1px solid var(--line-strong); border-radius: 10px; background: var(--raised); color: var(--accent);
  }
  .ico svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .row .k { display: block; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
  .row .v { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; }
  .row .d { display: block; font-size: 14px; color: var(--muted); line-height: 1.4; margin-top: 1px; }
  .row.weak .ico { color: var(--warn); }
  .row.t-azul .ico { color: var(--azul); }
  .row.t-vermelho .ico { color: var(--vermelho); }
  .row.t-roxo .ico { color: var(--roxo); }

  .foot { padding: 14px 20px 18px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }
</style>

          { icon: "word",    value: "Palavra Dada", desc: "Anuncia o que vai fazer. Cumprir o fortalece, falhar o enfraquece." },
          { icon: "pull",    tone: "azul",     label: "Atração", value: "Rumo", desc: "Fixa um ponto como destino e puxa tudo para ele, como garras se fechando." },
          { icon: "push",    tone: "vermelho", label: "Repulsão", value: "Limite", desc: "Traça uma linha que nada pode cruzar e empurra tudo para fora dela." },
          { icon: "path",    tone: "roxo",     label: "Fusão · Rumo + Limite", value: "Trajetória Perfeita", desc: "Une atração e repulsão num único caminho. Tudo na trajetória é apagado. Exige foco total." },
          { icon: "horizon", label: "Domínio de expansão", value: "Horizonte do Que Poderia Ter Sido", desc: "Mostra à vítima a vida inteira e cada chance perdida. Encerra a luta pela mente, sem matar." }
        ]
      },
      {
        title: "Pontos fracos",
        rows: [
          { icon: "cracked", label: "Limitação", value: "Disciplina Frágil", desc: "A barreira cai com distração, raiva, riso, fome ou sono.", weak: true },
          { icon: "exposed", label: "Limitação", value: "Preparo Exposto", desc: "Enquanto carrega a Trajetória Perfeita, a barreira cai e ele fica vulnerável.", weak: true },
          { icon: "once",    label: "Limitação", value: "Uso Único", desc: "O domínio funciona uma única vez contra cada alvo. Quem já se arrependeu, se redimiu ou negou não é afetado de novo.", weak: true },
          { icon: "fork",    label: "Limitação", value: "Resultado Incontrolável", desc: "Não controla se o domínio termina em redenção, frustração ou negação.", weak: true },
          { icon: "hourglass", label: "Consequência", value: "Esgotamento do Domínio", desc: "Depois do domínio, a barreira cai por um tempo e ele sente os arrependimentos da vítima.", weak: true },
          { icon: "strain",  label: "Custo", value: "Olhos Exigentes", desc: "Sem os óculos, os olhos gastam energia e causam dor de cabeça.", weak: true }
        ]
      }
    ]
  };

  /* ===== ícones próprios (grade 24, traço 1.6) ===== */
  const EYE = '<path d="M2.5 12c3-4.5 6.2-6.5 9.5-6.5s6.5 2 9.5 6.5c-3 4.5-6.2 6.5-9.5 6.5S5.5 16.5 2.5 12z"/><circle cx="12" cy="12" r="3"/>';
  const SHIELD = '<path d="M12 3l7 2.8v5.4c0 4.6-3 8.1-7 9.8-4-1.7-7-5.2-7-9.8V5.8z"/>';
  const ICONS = {
    shield: SHIELD + '<path d="M8.8 11.8l2.2 2.2 4.2-4.4"/>',
    eye: EYE + '<path d="M4 6l4.5 1.6M20 6l-4.5 1.6"/>',
    dive:
      '<path d="M6 5.5l11.5 11.5"/><path d="M17.8 10.4v6.8h-6.8"/>' +
      '<path d="M3.5 9.5l3-.8M9.5 3.5l-.8 3M3 14l2.6-.6"/>',
    rhythm:
      '<path d="M20 11a8 8 0 0 0-14.3-4.2M4.2 4.6v3.9h3.9"/>' +
      '<path d="M4 13a8 8 0 0 0 14.3 4.2M19.8 19.4v-3.9h-3.9"/>',
    claw:
      '<path d="M6.5 3.5c3.1 4.3 4.2 9.3 2.6 16.5"/>' +
      '<path d="M11.8 3.5c3.1 4.3 4.2 9.3 2.6 16.5"/>' +
      '<path d="M17 3.5c2.7 4.1 3.7 8.6 2.3 14.6"/>',
    word:
      '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H12l-4.5 4v-4h-1A2.5 2.5 0 0 1 4 13.5z"/>' +
      '<path d="M8.6 9.4l2.4 2.4 4.4-4.5"/>',
    horizon:
      '<rect x="3.5" y="5" width="17" height="15" rx="2.4"/><path d="M3.5 9.5h17M8 2.8v4M16 2.8v4"/>' +
      '<path d="M7 17h10M9.4 17a2.6 2.6 0 0 1 5.2 0"/>',
    cracked: SHIELD + '<path d="M12.6 5.2l-1.8 3.4 2.4 1.7-2 3.5 1.2 2.9"/>',
    fork:
      '<path d="M12 21v-7"/><path d="M12 14L6 8.5V4M12 14l6-5.5V4"/>' +
      '<path d="M4.2 6.2L6 3.8l1.8 2.4M16.2 6.2L18 3.8l1.8 2.4"/>',
    hourglass:
      '<path d="M6.5 3h11M6.5 21h11"/>' +
      '<path d="M8 3c0 5 4 6.2 4 9s-4 4-4 9M16 3c0 5-4 6.2-4 9s4 4 4 9"/>',
    strain: EYE + '<path d="M3.2 3.2l17.6 17.6"/>',
    pull:
      '<circle cx="12" cy="12" r="1.8"/>' +
      '<path d="M4 4l5 5M9 5.6V9H5.6M20 4l-5 5M15 5.6V9h3.4M4 20l5-5M9 18.4V15H5.6M20 20l-5-5M15 18.4V15h3.4"/>',
    push:
      '<circle cx="12" cy="12" r="1.8"/>' +
      '<path d="M9.6 9.6L4.5 4.5M4.5 8.8V4.5h4.3M14.4 9.6l5.1-5.1M19.5 8.8V4.5h-4.3M9.6 14.4l-5.1 5.1M4.5 15.2v4.3h4.3M14.4 14.4l5.1 5.1M19.5 15.2v4.3h-4.3"/>',
    path:
      '<path d="M3.5 6.5v11M7 12h13.5"/><path d="M16.5 7.8l4.2 4.2-4.2 4.2"/>' +
      '<path d="M9.5 8.8c1 .9 1 5.5 0 6.4"/>',
    exposed:
      '<path d="M12 3l7 2.8v5.4c0 4.6-3 8.1-7 9.8-4-1.7-7-5.2-7-9.8V5.8z" stroke-dasharray="3.4 3.2"/>' +
      '<circle cx="12" cy="11.8" r="1.6"/>',
    once:
      '<circle cx="12" cy="12" r="9"/><path d="M10.2 9.8L12.6 8v8.2"/>',
    glasses:
      '<path d="M3 9.2h8.2l-.9 5a2.6 2.6 0 0 1-2.6 2.1H6a2.6 2.6 0 0 1-2.5-2z"/>' +
      '<path d="M12.8 9.2H21l-.5 4.9a2.6 2.6 0 0 1-2.5 2.1h-1.7a2.6 2.6 0 0 1-2.6-2.1z"/>' +
      '<path d="M11.2 10.4c.5-.5 1.1-.5 1.6 0M3 9.2L2 7M21 9.2l1-2.2"/>',
    spark: '<path d="M12 3l1.9 5.6"M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/>'
  };

  /* ===== render ===== */
  const $ = (id) => document.getElementById(id);
  document.documentElement.style.setProperty("--accent", CHAR.accent);
  $("name").textContent = CHAR.name;
  $("subtitle").textContent = CHAR.subtitle;
  $("quote").textContent = "“" + CHAR.quote + "”";
  $("footL").textContent = CHAR.role;
  $("footR").textContent = CHAR.series;

  // classificação
  const bars = $("bars");
  $("gradeName").textContent = CHAR.grades[CHAR.grade - 1];
  bars.setAttribute("aria-label", "Classificação: " + CHAR.grades[CHAR.grade - 1]);
  for (let i = 0; i < 5; i++) {
    const b = document.createElement("i");
    b.style.height = (10 + i * 5) + "px";
    if (i < CHAR.grade) b.className = "on";
    bars.appendChild(b);
  }

  // radar: N vértices = N atributos
  (function () {
    const svg = $("radar"), NS = "http://www.w3.org/2000/svg";
    const n = CHAR.stats.length, max = 5, cx = 170, cy = 124, R = 80;
    const ang = (i) => (-90 + (360 / n) * i) * Math.PI / 180;
    const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
    const el = (tag, a, text) => {
      const e = document.createElementNS(NS, tag);
      for (const k in a) e.setAttribute(k, a[k]);
      if (text !== undefined) e.textContent = text;
      svg.appendChild(e); return e;
    };
    for (let l = 1; l <= max; l++) {
      const pts = CHAR.stats.map((_, i) => pt(i, R * l / max).map(v => v.toFixed(1)).join(",")).join(" ");
      el("polygon", { points: pts, fill: "none", stroke: "rgba(160,190,255,0.16)", "stroke-width": l === max ? 1.2 : 1 });
    }
    CHAR.stats.forEach((_, i) => {
      const [x, y] = pt(i, R);
      el("line", { x1: cx, y1: cy, x2: x.toFixed(1), y2: y.toFixed(1), stroke: "rgba(160,190,255,0.12)", "stroke-width": 1 });
    });
    const shape = CHAR.stats.map(([, v], i) => pt(i, R * v / max).map(c => c.toFixed(1)).join(",")).join(" ");
    el("polygon", { points: shape, fill: CHAR.accent, "fill-opacity": 0.2, stroke: CHAR.accent, "stroke-width": 1.8, "stroke-linejoin": "round" });
    CHAR.stats.forEach(([, v], i) => {
      const [x, y] = pt(i, R * v / max);
      el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: 3, fill: CHAR.accent, stroke: "#141c2c", "stroke-width": 1.5 });
    });
    CHAR.stats.forEach(([label, v], i) => {
      const [x, y] = pt(i, R + 18), c = Math.cos(ang(i)), s = Math.sin(ang(i));
      const anchor = c > 0.25 ? "start" : c < -0.25 ? "end" : "middle";
      const dy = s < -0.5 ? -10 : s > 0.5 ? 4 : -4;
      el("text", { x: x.toFixed(1), y: (y + dy).toFixed(1), "text-anchor": anchor, class: "name" }, label);
      el("text", { x: x.toFixed(1), y: (y + dy + 15).toFixed(1), "text-anchor": anchor, class: "val" }, String(v));
    });
    svg.setAttribute("aria-label", "Atributos: " + CHAR.stats.map(([l, v]) => l + " " + v).join(", "));
  })();

  // grupos de linhas
  const groups = $("groups");
  CHAR.groups.forEach((g) => {
    const sec = document.createElement("section");
    sec.className = "group";
    const h = document.createElement("h2");
    h.className = "section-label";
    h.textContent = g.title;
    const ul = document.createElement("ul");
    ul.className = "rows";
    g.rows.forEach((r) => {
      const li = document.createElement("li");
      li.className = "row" + (r.weak ? " weak" : "") + (r.tone ? " t-" + r.tone : "");
      li.innerHTML = '<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[r.icon] || ICONS.spark) + '</svg></span>' +
        '<span><span class="k"></span><span class="v"></span><span class="d"></span></span>';
      li.querySelector(".k").textContent = r.label || "";
      li.querySelector(".v").textContent = r.value;
      li.querySelector(".d").textContent = r.desc || "";
      ul.appendChild(li);
    });
    sec.append(h, ul);
    groups.appendChild(sec);
  });
</script>

</body></html>
