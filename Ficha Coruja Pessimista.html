<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ficha Coruja Pessimista</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
  /* Layout: mesmo modelo das outras fichas. Foto no topo, radar com duas formas (com e sem a manopla), painel de dados em linhas separadas por filetes. Troque só o objeto CHAR no fim do arquivo. */
  :root {
    --canvas: #0d0a08;
    --surface: #17120e;
    --raised: #211a14;
    --line: rgba(210, 170, 125, 0.13);
    --line-strong: rgba(210, 170, 125, 0.24);
    --accent: #c9a27c;
    --warn: #ef7a5a;
    --ink: #f3ebe2;
    --muted: #a89a8b;
    --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --font-body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    justify-content: center;
  }

  .card {
    width: min(460px, 100%);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 16px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 24px 60px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }

  /* foto + frase */
  .photo { position: relative; aspect-ratio: 744 / 500; background: #120e0b; border-bottom: 1px solid var(--line); overflow: hidden; }
  .ph { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--muted); font-size:12px; letter-spacing:.1em; text-transform:uppercase; background: radial-gradient(120% 90% at 50% 20%, #2a2018 0%, #0b1211 70%); }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%; display: block; }
  .quote {
    position: absolute; left: 16px; bottom: 16px; right: 16px;
    background: rgba(11, 9, 6, 0.92);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 16px; font-weight: 500; font-style: italic; line-height: 1.35;
    text-wrap: balance;
  }
  .quote::before {
    content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; background: var(--accent); border-radius: 2px;
  }
  .quote span { padding-left: 4px; display: block; }

  /* cabeçalho */
  .panel { padding: 20px 20px 4px; display: grid; gap: 18px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(34px, 9.4vw, 44px); line-height: 1.05; letter-spacing: 0.01em; text-transform: uppercase;
    text-wrap: balance;
  }
  .sub { margin: 2px 0 0; font-size: 14px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }

  .grade { display: flex; align-items: flex-end; gap: 12px; }
  .grade .txt { display: grid; text-align: right; line-height: 1.25; }
  .grade .lbl { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .grade .val { font-size: 16px; font-weight: 600; }
  .grade .note { font-size: 12px; color: var(--muted); }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 30px; }
  .bars i { display: block; width: 6px; border-radius: 1.5px; background: rgba(255, 205, 150, 0.16); }
  .bars i.on { background: var(--accent); }

  /* radar */
  .section-label { margin: 0 0 4px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .radar-box { border: 1px solid var(--line); border-radius: 12px; background: var(--raised); padding: 12px 8px 4px; }
  .radar-box .section-label { padding-left: 8px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 2px 8px 0; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 0; display: inline-block; border-top: 2px solid var(--accent); }
  .legend i.base { border-top: 2px dashed var(--muted); }
  #radar { width: 100%; height: auto; display: block; }
  #radar text { font-family: var(--font-body); }
  #radar .name { font-size: 12px; font-weight: 500; fill: var(--muted); }
  #radar .val { font-size: 14px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }

  /* linhas de dados */
  .groups { display: grid; gap: 20px; }
  .group .section-label { margin: 0 0 8px; font-weight: 500; }
  .row .k:empty, .row .d:empty { display: none; }
  .rows { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .ico {
    width: 40px; height: 40px; display: grid; place-items: center;
    border: 1px solid var(--line-strong); border-radius: 10px; background: var(--raised); color: var(--accent);
  }
  .ico svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .row .k { display: block; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
  .row .v { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; }
  .row .d { display: block; font-size: 14px; color: var(--muted); line-height: 1.4; margin-top: 1px; }
  .row.weak .ico { color: var(--warn); }

  .foot { padding: 14px 20px 18px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }
</style>

  /* ===== render ===== */
  const $ = (id) => document.getElementById(id);
  document.documentElement.style.setProperty("--accent", CHAR.accent);
  $("name").textContent = CHAR.name;
  $("subtitle").textContent = CHAR.subtitle;
  $("quote").textContent = "“" + CHAR.quote + "”";
  $("footL").textContent = CHAR.role;
  $("footR").textContent = CHAR.series;
  $("gradeNote").textContent = CHAR.gradeNote || "";

  // classificação
  const bars = $("bars");
  $("gradeName").textContent = CHAR.grades[CHAR.grade - 1];
  bars.setAttribute("aria-label", "Classificação: " + CHAR.grades[CHAR.grade - 1]);
  for (let i = 0; i < 5; i++) {
    const b = document.createElement("i");
    b.style.height = (10 + i * 5) + "px";
    if (i < CHAR.grade) b.className = "on";
    bars.appendChild(b);
  }

  // legenda do radar (só quando há valores sem a manopla)
  if (CHAR.statsBase) {
    $("legend").innerHTML = '<span><i></i>' + CHAR.legend[0] + '</span><span><i class="base"></i>' + CHAR.legend[1] + '</span>';
  } else {
    $("legend").hidden = true;
  }

  // radar: N vértices = N atributos
  (function () {
    const svg = $("radar"), NS = "http://www.w3.org/2000/svg";
    const n = CHAR.stats.length, max = 5, cx = 170, cy = 124, R = 80;
    const ang = (i) => (-90 + (360 / n) * i) * Math.PI / 180;
    const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
    const el = (tag, a, text) => {
      const e = document.createElementNS(NS, tag);
      for (const k in a) e.setAttribute(k, a[k]);
      if (text !== undefined) e.textContent = text;
      svg.appendChild(e); return e;
    };
    const poly = (vals) => vals.map((v, i) => pt(i, R * v / max).map(c => c.toFixed(1)).join(",")).join(" ");
    for (let l = 1; l <= max; l++) {
      const pts = CHAR.stats.map((_, i) => pt(i, R * l / max).map(v => v.toFixed(1)).join(",")).join(" ");
      el("polygon", { points: pts, fill: "none", stroke: "rgba(210,170,125,0.16)", "stroke-width": l === max ? 1.2 : 1 });
    }
    CHAR.stats.forEach((_, i) => {
      const [x, y] = pt(i, R);
      el("line", { x1: cx, y1: cy, x2: x.toFixed(1), y2: y.toFixed(1), stroke: "rgba(210,170,125,0.12)", "stroke-width": 1 });
    });
    const vals = CHAR.stats.map(([, v]) => v);
    el("polygon", { points: poly(vals), fill: CHAR.accent, "fill-opacity": 0.2, stroke: CHAR.accent, "stroke-width": 1.8, "stroke-linejoin": "round" });
    if (CHAR.statsBase) {
      el("polygon", { points: poly(CHAR.statsBase), fill: "rgba(168,152,132,0.14)", stroke: "#a89884", "stroke-width": 1.6, "stroke-dasharray": "4 3", "stroke-linejoin": "round" });
    }
    vals.forEach((v, i) => {
      const [x, y] = pt(i, R * v / max);
      el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: 3, fill: CHAR.accent, stroke: "#211a14", "stroke-width": 1.5 });
    });
    CHAR.stats.forEach(([label, v], i) => {
      const [x, y] = pt(i, R + 18), c = Math.cos(ang(i)), s = Math.sin(ang(i));
      const anchor = c > 0.25 ? "start" : c < -0.25 ? "end" : "middle";
      const dy = s < -0.5 ? -10 : s > 0.5 ? 4 : -4;
      el("text", { x: x.toFixed(1), y: (y + dy).toFixed(1), "text-anchor": anchor, class: "name" }, label);
      el("text", { x: x.toFixed(1), y: (y + dy + 15).toFixed(1), "text-anchor": anchor, class: "val" }, String(v));
    });
    svg.setAttribute("aria-label", "Atributos com a manopla: " + CHAR.stats.map(([l, v]) => l + " " + v).join(", ") +
      (CHAR.statsBase ? ". Sem a manopla: " + CHAR.stats.map(([l], i) => l + " " + CHAR.statsBase[i]).join(", ") : ""));
  })();

  // grupos de linhas
  const groups = $("groups");
  CHAR.groups.forEach((g) => {
    const sec = document.createElement("section");
    sec.className = "group";
    const h = document.createElement("h2");
    h.className = "section-label";
    h.textContent = g.title;
    const ul = document.createElement("ul");
    ul.className = "rows";
    g.rows.forEach((r) => {
      const li = document.createElement("li");
      li.className = "row" + (r.weak ? " weak" : "");
      li.innerHTML = '<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[r.icon] || ICONS.spark) + '</svg></span>' +
        '<span><span class="k"></span><span class="v"></span><span class="d"></span></span>';
      li.querySelector(".k").textContent = r.label || "";
      li.querySelector(".v").textContent = r.value;
      li.querySelector(".d").textContent = r.desc || "";
      ul.appendChild(li);
    });
    sec.append(h, ul);
    groups.appendChild(sec);
  });
</script>
